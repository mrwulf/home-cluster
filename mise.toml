[settings]
minimum_release_age = "0s"

[tools]
kubectl = "1.37.1"
task = "3.53.1"
yq = "4.54.1"
jq = "1.8.2"
# Keep in sync with talosVersion in talos/talenv.yaml — an older client can't
# decode config documents (e.g. BondConfig) introduced by a newer Talos release.
talosctl = "1.14.2"

# Testing tools
flux2 = "2.9.6"
kubeconform = "0.8.0"
yamllint = "1.38.0"
"npm:markdownlint-cli" = "0.49.1"
"npm:prettier" = "3.9.9"
pre-commit = "4.6.2"
opentofu = "1.13.0"
"github:home-operations/flate" = "latest"
