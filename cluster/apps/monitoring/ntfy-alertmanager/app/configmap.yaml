---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-alertmanager
data:
  config.scfg: |
    http-address :8080
    log-level info
    alert-mode multi

    user alertmanager
    password NTFY_ALERTMANAGER_WEBHOOK_PASSWORD_PLACEHOLDER

    labels {
        order "severity"

        # No tags here: the bridge adds label tags to resolved notifications too,
        # which put a siren or warning icon next to the resolved check mark.
        # The severity icon for firing alerts comes from body.tmpl instead.
        severity "critical" {
            priority 5
        }

        severity "warning" {
            priority 3
        }

        severity "info" {
            priority 2
        }
    }

    resolved {
        tags "white_check_mark"
        priority 1
    }

    ntfy {
        server https://ntfy.${SECRET_DOMAIN}
        topic alertmanager-alerts
        access-token NTFY_ALERTMANAGER_ACCESS_TOKEN_PLACEHOLDER
        markdown true
        generator-url-label source
        template-path /etc/ntfy-alertmanager/body.tmpl
    }
  # The default body lists every label and annotation of every alert in the group.
  # A big group exceeds ntfy's 4096-byte message limit, and ntfy then rejects it as an attachment.
  # One truncated line per alert, capped at 10 lines of 200 characters, keeps the body around 3 KB at most,
  # including the logs link.
  # The line is the description, because it names the node, mountpoint, pod and so on (the summary is often
  # generic, for example "Host filesystem free space is getting low"). Summary and alertname are fallbacks.
  # Alertmanager keeps a resolved alert in its group's next notification, so one notification can hold both
  # firing and resolved alerts. When it does, the body splits into a Firing and a Resolved section.
  # A group that is all firing or all resolved is a plain list. $f and $r are "has a firing alert" and
  # "has a resolved alert". The 10 line cap is over the whole group, in alert order.
  # A severity line leads notifications that have a firing alert, so resolved ones show just the check mark tag.
  # A logs_url annotation shared by the whole group becomes a trailing link on those notifications.
  body.tmpl: |
    {{ $f := false }}{{ $r := false }}{{ range .Alerts }}{{ if eq .Status "firing" }}{{ $f = true }}{{ else }}{{ $r = true }}{{ end }}{{ end }}{{ if $f }}{{ if eq .CommonLabels.severity "critical" }}🚨 critical
    {{ else if eq .CommonLabels.severity "warning" }}⚠️ warning
    {{ end }}{{ end }}{{ if and $f $r }}**Firing**
    {{ end }}{{ range $i, $a := .Alerts }}{{ if and (lt $i 10) (or (ne $a.Status "resolved") (not $f)) }}- {{ printf "%.200s" (or $a.Annotations.description $a.Annotations.summary $a.Labels.alertname) }}
    {{ end }}{{ end }}{{ if and $f $r }}
    **Resolved**
    {{ range $i, $a := .Alerts }}{{ if and (lt $i 10) (eq $a.Status "resolved") }}- {{ printf "%.200s" (or $a.Annotations.description $a.Annotations.summary $a.Labels.alertname) }}
    {{ end }}{{ end }}{{ end }}{{ if gt (len .Alerts) 10 }}({{ len .Alerts }} alerts in group, first 10 shown)
    {{ end }}{{ if $f }}{{ with .CommonAnnotations.logs_url }}[Logs]({{ . }})
    {{ end }}{{ end }}
