# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy-alertmanager
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  values:
    controllers:
      ntfy-alertmanager:
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          init-config:
            image:
              repository: alpine
              tag: 3.24.2
            command: ["/bin/sh", "-c"]
            args:
              - |
                sed -e "s|NTFY_ALERTMANAGER_ACCESS_TOKEN_PLACEHOLDER|$NTFY_ACCESS_TOKEN|g" \
                    -e "s|NTFY_ALERTMANAGER_WEBHOOK_PASSWORD_PLACEHOLDER|$WEBHOOK_PASSWORD|g" \
                    /etc/ntfy-alertmanager-template/config.scfg > /etc/ntfy-alertmanager/config
            envFrom:
              - secretRef:
                  name: ntfy-alertmanager-secret

        containers:
          main:
            image:
              repository: docker.io/xenrox/ntfy-alertmanager
              tag: "1.0.1"
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: ntfy-alertmanager
        ports:
          http:
            port: 8080

    persistence:
      config-template:
        type: custom
        volumeSpec:
          configMap:
            name: ntfy-alertmanager
        advancedMounts:
          ntfy-alertmanager:
            init-config:
              - path: /etc/ntfy-alertmanager-template/config.scfg
                subPath: config.scfg
      config:
        type: emptyDir
        advancedMounts:
          ntfy-alertmanager:
            init-config:
              - path: /etc/ntfy-alertmanager
            main:
              - path: /etc/ntfy-alertmanager
