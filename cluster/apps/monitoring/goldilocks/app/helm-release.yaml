apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app goldilocks
spec:
  interval: 1h
  chart:
    spec:
      chart: goldilocks
      version: 11.2.0
      sourceRef:
        kind: HelmRepository
        name: fairwinds-charts
        namespace: flux-system
  values:
    vpa:
      enabled: true
      recommender:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
      admissionController:
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            memory: 192Mi
        certGen:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
    dashboard:
      replicaCount: 1
      ingress:
        enabled: false
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 64Mi

    controller:
      resources:
        requests:
          cpu: 15m
          memory: 32Mi
        limits:
          memory: 128Mi
