---
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: bonding-degraded-silence
  namespace: monitoring
  annotations:
    valid-until: "2036-05-28T23:00:00Z"
spec:
  matchers:
    - name: alertname
      matchType: "=~"
      value: "CephNodeNetworkBondDegraded|NodeBondingDegraded|HostNetworkInterfaceDegraded"
---
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: packet-drops-silence
  namespace: monitoring
  annotations:
    valid-until: "2036-05-28T23:00:00Z"
spec:
  matchers:
    - name: alertname
      matchType: "=~"
      value: "CephNodeNetworkPacketDrops|CephNodeNetworkPacketErrors"
---
# scrob does not implement PKCE (see its oidc-client.yaml), so this alert can never clear
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: scrob-pkce-silence
  namespace: monitoring
  annotations:
    valid-until: "2036-05-28T23:00:00Z"
spec:
  matchers:
    - name: alertname
      matchType: "="
      value: "PocketIDOIDCClientPKCESupported"
    - name: name
      matchType: "="
      value: "scrob"
