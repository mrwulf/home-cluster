---
# Note: Gatus vars should be escaped with $${VAR_NAME} to avoid interpolation by Flux
web:
  port: $${WEB_PORT}
  read-buffer-size: 32768
storage:
  type: postgres
  path: postgres://$${INIT_POSTGRES_USER}:$${INIT_POSTGRES_PASS}@$${INIT_POSTGRES_HOST}:5432/$${INIT_POSTGRES_DBNAME}?sslmode=disable
  caching: true
metrics: true
debug: false
ui:
  title: Status | Gatus
  header: Status
alerting:
  pushover:
    application-token: $${PUSHOVER_TOKEN}
    user-key: $${PUSHOVER_USER_KEY}
    priority: 0
    default-alert:
      description: health-check failed
      send-on-resolved: true
      failure-threshold: 3
      success-threshold: 3
# connectivity:
#   checker:
#     target: https://radar.cloudflare.com/ip
#     interval: 1m
endpoints:
  - name: DNS Resolver
    group: internal
    url: 10.0.10.14
    interval: 1m
    dns:
      query-name: "status.home.${SECRET_DOMAIN}"
      query-type: A
    conditions:
      - "[BODY] == 10.0.10.30"
      - "[DNS_RCODE] == NOERROR"
    alerts: &alerts
      - type: pushover
    ui:
      hide-hostname: true
      hide-url: true
  - name: certificate-external
    group: external
    url: "https://flux-receiver.${SECRET_DOMAIN}"
    interval: 1h
    conditions:
      - "[CERTIFICATE_EXPIRATION] > 240h"
      # - "[DOMAIN_EXPIRATION] > 720h"
    alerts: *alerts
    ui:
      hide-hostname: true
      hide-url: true
  - name: certificate-internal
    group: internal
    url: "https://status.home.${SECRET_DOMAIN}"
    interval: 1h
    conditions:
      - "[CERTIFICATE_EXPIRATION] > 240h"
      # - "[DOMAIN_EXPIRATION] > 720h"
    alerts: *alerts
    ui:
      hide-hostname: true
      hide-url: true
  - name: kubernetes api
    group: internal
    url: "https://k8s.home:6443"
    interval: 1m
    client:
      insecure: true
    conditions:
      - "[STATUS] == 401"
      - "[BODY].message == Unauthorized"
    alerts: *alerts
    ui:
      hide-hostname: true
      hide-url: true
  - name: NAS
    group: services
    url: "ssh://${CORE_NFS_SERVER}:22" # port is optional. Default is 22.
    ssh:
      username: ""
      password: ""
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 0"
    alerts: *alerts
    ui:
      hide-hostname: true
      hide-url: true
  - name: Firewall - Active
    group: services
    url: "https://firewall.${SECRET_DOMAIN}:${FIREWALL_PORT}"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts: *alerts
    ui:
      hide-hostname: true
      hide-url: true
  - name: Firewall - Primary
    group: services
    url: "https://firewall03.${SECRET_DOMAIN}:${FIREWALL_PORT}"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts: *alerts
    ui:
      hide-hostname: true
      hide-url: true
  - name: Firewall - Backup
    group: services
    url: "https://firewall02.${SECRET_DOMAIN}:${FIREWALL_PORT}"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts: *alerts
    ui:
      hide-hostname: true
      hide-url: true
  - name: US VPS Endpoint (OVH)
    group: external
    url: "https://vps-us.${SECRET_DOMAIN}"
    interval: 1m
    conditions:
      - "[STATUS] == 418"
    alerts: *alerts
    ui:
      hide-hostname: true
      hide-url: true
  - name: EU VPS Endpoint (Hetzner)
    group: external
    url: "https://vps-eu.${SECRET_DOMAIN}"
    interval: 1m
    conditions:
      - "[STATUS] == 418"
    alerts: *alerts
    ui:
      hide-hostname: true
      hide-url: true
  - name: VPS-Primary Ingress (excluded apps)
    group: external
    url: "https://ingress.${SECRET_DOMAIN}"
    interval: 2m
    conditions:
      - "[STATUS] == 418"
    alerts: *alerts
    ui:
      hide-hostname: true
      hide-url: true
  - name: Fast Ingress via Cloudflare Tunnel (primary)
    group: external
    url: "https://fast.${SECRET_DOMAIN}"
    interval: 2m
    conditions:
      - "[STATUS] == 418"
    alerts: *alerts
    ui:
      hide-hostname: true
      hide-url: true
  - name: Ordinary App DNS/Proxy Routing (flux-receiver)
    group: external
    # Unlike the checks above, this hits a real per-app hostname on the default
    # Cloudflare-primary path (same external-dns-managed CNAME as any other app, e.g.
    # meals/plans/etc.) rather than one of the meta hostnames external-dns never touches.
    # Catches the class of bug where fast.${SECRET_DOMAIN} itself is healthy but an
    # individual app's own CNAME record isn't proxied, so it can't reach the tunnel at
    # all - the fast-failover worker's own tunnel-health probe can't see that, since it
    # only tests a hostname (external.${SECRET_DOMAIN}) that's always explicitly proxied.
    url: "https://flux-receiver.${SECRET_DOMAIN}"
    interval: 2m
    conditions:
      - "[STATUS] == 404"
    alerts: *alerts
    ui:
      hide-hostname: true
      hide-url: true
  - name: Cloudflare Tunnel Direct
    group: external
    url: "https://external.${SECRET_DOMAIN}"
    interval: 2m
    conditions:
      - "[STATUS] == 418"
    alerts: *alerts
    ui:
      hide-hostname: true
      hide-url: true
  - name: SMTP Relay
    group: services
    url: "tcp://smtp-relay.system.svc.cluster.local:2525"
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    alerts: *alerts
    ui:
      hide-hostname: true
      hide-url: true
  - name: Ollama
    group: services
    url: "http://ollama.ai.svc.cluster.local:11434/api/version"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts: *alerts
    ui:
      hide-hostname: true
      hide-url: true
