apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app smartctl-exporter
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-smartctl-exporter
      version: 0.17.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-charts
        namespace: flux-system
  values:
    fullnameOverride: *app
    serviceMonitor:
      enabled: true
      interval: 30m
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: instance
          action: replace
    prometheusRules:
      enabled: true
      rules:
        smartCTLDDeviceTemperature:
          expr: smartctl_device_temperature{temperature_type="current"} > 70
          annotations:
            summary: Device has temperature higher than 70°C
            description: Device {{ $labels.device }} on instance {{ $labels.instance }} has temperature higher than 70°C
