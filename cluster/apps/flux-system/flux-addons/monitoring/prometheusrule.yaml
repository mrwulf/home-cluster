---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-rules
  namespace: flux-system
spec:
  groups:
    - name: flux.rules
      rules:
        - alert: FluxComponentAbsent
          annotations:
            summary: Flux component has disappeared from Prometheus target discovery.
          expr: |
            absent(up{job=~".*flux-system.*"} == 1)
          for: 15m
          labels:
            severity: critical
        - alert: FluxReconciliationFailure
          annotations:
            summary: >-
              {{ $labels.kind }} {{ $labels.namespace }}/{{ $labels.name }} reconciliation
              has been failing for more than 15 minutes.
          expr: |
            max(gotk_reconcile_condition{status="False",type="Ready"}) by (namespace, name, kind)
              +
            on(namespace, name, kind) (max(gotk_reconcile_condition{status="Deleted"})
              by (namespace, name, kind)) * 2 == 1
          for: 15m
          labels:
            severity: critical
    - name: tofu.rules
      rules:
        - alert: TofuStackStuck
          annotations:
            summary: >-
              Terraform {{ $labels.exported_namespace }}/{{ $labels.name }} has been stuck in
              progress for more than 90 minutes.
            description: >-
              Ready=Unknown that long means tofu-controller is wedged, not applying (a real run
              ends in minutes). After 45m the tofu-controller-recovery CronJob clears a stale
              lock record (if the lock Lease is free) or restarts the controller (2h cooldown),
              so this firing means neither helped. Check `kubectl get terraform -A`, the
              controller logs, the lock Lease, and the CronJob's last job.
          expr: |
            tofu_resource_info{ready="Unknown"}
          for: 90m
          labels:
            severity: critical
