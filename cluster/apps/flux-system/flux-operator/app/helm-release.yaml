apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: flux-operator
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: flux-operator-values
    - kind: Secret
      name: flux-ui-oidc-credentials
      valuesKey: FLUX_UI_CLIENT_ID
      targetPath: web.config.authentication.oauth2.clientID
      optional: true
    - kind: Secret
      name: flux-ui-oidc-credentials
      valuesKey: FLUX_UI_CLIENT_SECRET
      targetPath: web.config.authentication.oauth2.clientSecret
      optional: true
