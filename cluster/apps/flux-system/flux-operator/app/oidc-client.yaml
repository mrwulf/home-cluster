---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: flux-ui
spec:
  name: Flux UI
  launchUrl: https://flux-ui.home.${SECRET_DOMAIN}/
  callbackUrls:
    - https://flux-ui.home.${SECRET_DOMAIN}/oauth2/callback
  logoutCallbackUrls:
    - https://flux-ui.home.${SECRET_DOMAIN}/
  allowedUserGroups:
    - name: admin
      namespace: auth
  pkceEnabled: true
  secret:
    name: flux-ui-oidc-credentials
    keys:
      clientID: FLUX_UI_CLIENT_ID
      clientSecret: FLUX_UI_CLIENT_SECRET
      issuerUrl: FLUX_UI_OIDC_ISSUER_URL
