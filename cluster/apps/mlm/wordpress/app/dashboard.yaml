---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: wordpress
  namespace: mlm
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: mlm
  json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "links": [],
      "schemaVersion": 39,
      "tags": ["wordpress", "apache", "mlm"],
      "time": { "from": "now-6h", "to": "now" },
      "title": "WordPress & Apache Performance",
      "uid": "wordpress-mlm",
      "panels": [
        {
          "title": "Apache Requests Rate",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
              "expr": "rate(apache_accesses_total{namespace=\"mlm\"}[5m])",
              "legendFormat": "requests/s",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Apache Worker Status",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
              "expr": "apache_workers{namespace=\"mlm\"}",
              "legendFormat": "{{state}} workers",
              "refId": "A"
            }
          ]
        }
      ]
    }
