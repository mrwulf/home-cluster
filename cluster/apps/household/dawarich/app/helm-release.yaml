# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dawarich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

    controllers:
      dawarich:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6
            envFrom:
              - secretRef:
                  name: dawarich-db-init-secret
        containers:
          app:
            image:
              repository: freikin/dawarich
              tag: 1.14.0
            env:
              WEB_CONCURRENCY: "1"
              PROMETHEUS_EXPORTER_ENABLED: "true"
              PROMETHEUS_EXPORTER_PORT: "9394"
              PROMETHEUS_EXPORTER_HOST: "0.0.0.0"
            envFrom: &dawarichEnvFrom
              - configMapRef:
                  name: dawarich-configmap
              - secretRef:
                  name: dawarich-secret
              - secretRef:
                  name: dawarich-oidc-credentials
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 3000
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 3000
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources: &dawarichResources
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi

      sidekiq:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: freikin/dawarich
              tag: 1.14.0
            env:
              BACKGROUND_PROCESSING_CONCURRENCY: "3"
              PROMETHEUS_EXPORTER_ENABLED: "false"
              PROMETHEUS_EXPORTER_HOST: "dawarich.household.svc.cluster.local"
            envFrom: *dawarichEnvFrom
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - pgrep
                      - -f
                      - sidekiq
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - pgrep
                      - -f
                      - sidekiq
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources: *dawarichResources

    service:
      app:
        controller: dawarich
        ports:
          http:
            port: 3000
          metrics:
            port: 9394

    serviceMonitor:
      app:
        serviceName: dawarich
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s

    route:
      app:
        enabled: true
        annotations:
          gatus.io/enabled: "true"
        parentRefs:
          - name: external-gateway
            namespace: networking
        hostnames:
          - "${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"
        rules:
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: traefik-middleware-chain-no-auth
            backendRefs:
              - identifier: app
                port: http

    persistence:
      storage:
        existingClaim: "${VOLSYNC_CLAIM}"
        advancedMounts:
          dawarich: &storageMounts
            app:
              - path: /var/app/storage
                subPath: storage
              - path: /var/app/public
                subPath: public
              - path: /var/app/tmp/imports/watched
                subPath: watched
          sidekiq: *storageMounts
      tmp:
        type: emptyDir
        advancedMounts:
          dawarich: &tmpMounts
            app:
              - path: /tmp
                subPath: tmp
              - path: /var/app/tmp
                subPath: app-tmp
          sidekiq: *tmpMounts
