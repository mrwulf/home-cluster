---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: dawarich
spec:
  name: Dawarich
  launchUrl: https://track.${SECRET_DOMAIN}/
  callbackUrls:
    - https://track.${SECRET_DOMAIN}/users/auth/openid_connect/callback
  logoutCallbackUrls:
    - https://track.${SECRET_DOMAIN}/
  allowedUserGroups:
    - name: users
      namespace: auth
    - name: admin
      namespace: auth
  pkceEnabled: true
  secret:
    name: dawarich-oidc-credentials
    keys:
      clientID: OIDC_CLIENT_ID
      clientSecret: OIDC_CLIENT_SECRET
      issuerUrl: OIDC_ISSUER
