# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app plainspace
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      plainspace:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6
            envFrom:
              - secretRef:
                  name: plainspace-db-init-secret
        containers:
          app:
            image:
              repository: ghcr.io/super-productivity/plainspace-app
              tag: 70da9b9a08389c96d33bf2e389c640bd61a3ba7e
            envFrom:
              - secretRef:
                  name: plainspace-secret
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi

    service:
      app:
        controller: plainspace
        ports:
          http:
            port: 3000

    route:
      app:
        enabled: true
        annotations:
          gatus.io/enabled: "true"
        parentRefs:
          - name: external-gateway
            namespace: networking
        hostnames:
          - "space.${SECRET_DOMAIN}"
        rules:
          - backendRefs:
              - identifier: app
                port: http
