---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: postiz
spec:
  name: Postiz
  launchUrl: https://postiz.home.${SECRET_DOMAIN}/
  callbackUrls:
    # Postiz's generic OAuth provider uses ${FRONTEND_URL}/settings as the redirect URI
    - https://postiz.home.${SECRET_DOMAIN}/settings
  logoutCallbackUrls:
    - https://postiz.home.${SECRET_DOMAIN}/
  allowedUserGroups:
    - name: users
      namespace: auth
  secret:
    name: postiz-oidc-credentials
    keys:
      clientID: POSTIZ_OAUTH_CLIENT_ID
      clientSecret: POSTIZ_OAUTH_CLIENT_SECRET
