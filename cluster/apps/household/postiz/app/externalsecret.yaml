---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postiz
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: postiz
    template:
      data:
        JWT_SECRET: "{{ .JWT_SECRET }}"
        POSTGRES_USER: "{{ .username }}"
        POSTGRES_PWD: "{{ .password }}"
        # The DB password is embedded in a URL, so it must be URL-safe (generate it as hex).
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@postgres17-rw.databases.svc.cluster.local:5432/postiz"
  data:
    - secretKey: username
      remoteRef:
        key: "Postiz DB Credentials"
        property: "username"
    - secretKey: password
      remoteRef:
        key: "Postiz DB Credentials"
        property: "password"
    - secretKey: JWT_SECRET
      remoteRef:
        key: "Postiz JWT Secret"
        property: "password"
