# yaml-language-server: $schema=https://github.com/fluxcd-community/flux2-schemas/raw/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app postiz
  namespace: flux-system
spec:
  targetNamespace: household
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-stores
    - name: volsync
    - name: postgres-cluster
    - name: dragonfly-cluster
    - name: temporal
  path: ./cluster/apps/household/postiz/app
  components:
    - ../../../../templates/volsync/primary
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: postiz.home
      VOLSYNC_CLAIM: postiz-data
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_NFS_START_MINUTE: "53"
      VOLSYNC_B2_START_MINUTE: "18"
