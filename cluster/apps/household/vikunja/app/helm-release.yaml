# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vikunja
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          dnsConfig:
            options:
              - name: ndots
                value: "1"
        initContainers:
          init-config:
            image:
              repository: alpine
              tag: 3.24.2
            command: ["/bin/sh", "-c"]
            args:
              - |
                sed -e "s|VIKUNJA_CLIENT_ID_PLACEHOLDER|$VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_CLIENTID|g" \
                    -e "s|VIKUNJA_CLIENT_SECRET_PLACEHOLDER|$VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_CLIENTSECRET|g" \
                    /etc/vikunja-template/config.yml > /etc/vikunja/config.yml
            envFrom:
              - secretRef:
                  name: vikunja-oidc-credentials
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
        containers:
          app:
            image:
              repository: vikunja/vikunja
              tag: 2.6.0
              pullPolicy: IfNotPresent
            env:
              - name: VIKUNJA_SERVICE_TIMEZONE
                value: ${TIMEZONE}
              - name: VIKUNJA_SERVICE_PUBLICURL
                value: https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}
              - name: VIKUNJA_DATABASE_TYPE
                value: "postgres"
              - name: VIKUNJA_DATABASE_HOST
                value: postgres17-rw.databases.svc.cluster.local.
              - name: VIKUNJA_DATABASE_DATABASE
                value: vikunja
              - name: VIKUNJA_SERVICE_ENABLETASKCOMMENTS
                value: "false"
              - name: VIKUNJA_MAILER_FROMEMAIL
                value: lists@${SECRET_DOMAIN}
              - name: VIKUNJA_MAILER_ENABLED
                value: "true"
              - name: VIKUNJA_MAILER_HOST
                value: smtp-relay.home.svc.cluster.local
              - name: VIKUNJA_MAILER_PORT
                value: "2525"
              - name: VIKUNJA_METRICS_ENABLED
                value: "true"
              - name: &envsecret VIKUNJA_SERVICE_SECRET
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: *envsecret
              - name: &envdbuser VIKUNJA_DATABASE_USER
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: *envdbuser
              - name: &envdbpass VIKUNJA_DATABASE_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: *envdbpass
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 1024Mi

    service:
      main:
        controller: main
        ports:
          http:
            port: 3456

    route:
      main:
        enabled: true
        annotations:
          gatus.io/enabled: "true"
        parentRefs:
          - name: external-gateway
            namespace: networking
        hostnames:
          - "lists.${SECRET_DOMAIN}"
        rules:
          - backendRefs:
              - identifier: main
                port: http

    persistence:
      files:
        existingClaim: "${VOLSYNC_CLAIM}"
        advancedMounts:
          main:
            app:
              - path: /app/vikunja/files
      config-template:
        type: custom
        volumeSpec:
          configMap:
            name: vikunja
        advancedMounts:
          main:
            init-config:
              - path: /etc/vikunja-template/config.yml
                subPath: config.yml
      config:
        type: emptyDir
        advancedMounts:
          main:
            init-config:
              - path: /etc/vikunja
            app:
              - path: /etc/vikunja
