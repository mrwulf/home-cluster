# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app n8n
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      n8n:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"

        containers:
          app:
            image:
              repository: ghcr.io/n8n-io/n8n
              tag: 2.38.3
            env:
              DB_SQLITE_VACUUM_ON_STARTUP: true
              EXECUTIONS_DATA_PRUNE: true
              EXECUTIONS_DATA_MAX_AGE: 7
              EXECUTIONS_DATA_PRUNE_MAX_COUNT: 50000
              N8N_DIAGNOSTICS_ENABLED: false
              N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: false
              N8N_PROTOCOL: "https"
              N8N_PORT: &port 8080
              N8N_HOST: &host "{{ .Release.Name }}.home.${SECRET_DOMAIN}"
              N8N_LOG_LEVEL: info
              N8N_LOG_OUTPUT: console
              N8N_BLOCK_ENV_ACCESS_IN_NODE: false
              N8N_ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: n8n
                    key: N8N_ENCRYPTION_KEY
              EXTERNAL_HOOK_FILES: /etc/n8n/hooks/hooks.js
              EXTERNAL_FRONTEND_HOOKS_URLS: /assets/oidc-frontend-hook.js
              N8N_ADDITIONAL_NON_UI_ROUTES: auth
              N8N_TRUST_PROXY: "true"
              OIDC_ISSUER_URL: "https://id.${SECRET_DOMAIN}"
              OIDC_REDIRECT_URI: "https://n8n.home.${SECRET_DOMAIN}/auth/oidc/callback"
            envFrom:
              - secretRef:
                  name: n8n-oidc-credentials
              - secretRef:
                  name: n8n-trip-ingest-secrets
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1.5Gi

    service:
      app:
        ports:
          http:
            port: *port

    route:
      main:
        enabled: true
        annotations:
          gatus.io/enabled: "true"
        parentRefs:
          - name: internal-gateway
            namespace: networking
        hostnames:
          - "n8n.home.${SECRET_DOMAIN}"
        rules:
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: rfc1918-ips
            backendRefs:
              - identifier: app
                port: http
      webhook:
        enabled: true
        annotations:
          gatus.io/enabled: "true"
          gatus.io/endpoint: |
            conditions:
              - "[STATUS] == 200"
        parentRefs:
          - name: external-gateway
            namespace: networking
        hostnames:
          - "n8n-webhook.${SECRET_DOMAIN}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /webhook
              - path:
                  type: PathPrefix
                  value: /webhook-test
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: traefik-middleware-chain-no-auth
            backendRefs:
              - identifier: app
                port: http

    persistence:
      hooks:
        type: configMap
        name: n8n-oidc-hooks
        globalMounts:
          - path: /etc/n8n/hooks/hooks.js
            subPath: hooks.js
            readOnly: true
      data:
        existingClaim: *app
        advancedMounts:
          n8n:
            app:
              - path: /home/node/.n8n
