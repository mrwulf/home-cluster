# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app wallos
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              # renovate: depName=ghcr.io/ellite/wallos datasource=docker
              repository: ghcr.io/ellite/wallos
              tag: 5.4.5
            env:
              OIDC_ENABLED: "true"
              OIDC_PROVIDER_NAME: "Home PocketID"
              OIDC_ISSUER: "https://id.${SECRET_DOMAIN}"
              OIDC_REDIRECT_URL: "https://subscriptions.home.${SECRET_DOMAIN}/index.php"
              OIDC_SCOPES: "openid email profile groups"
              OIDC_USER_IDENTIFIER: "sub"
              OIDC_AUTO_CREATE_USER: "true"
              OIDC_DISABLE_PASSWORD_LOGIN: "true"
              SSRF_ALLOWLIST: "id.${SECRET_DOMAIN}"
            envFrom:
              - secretRef:
                  name: wallos-oidc-credentials
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /login.php
                    port: &port 80
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
    service:
      main:
        controller: main
        ports:
          http:
            port: *port

    route:
      main:
        enabled: true
        annotations:
          gatus.io/enabled: "true"
        parentRefs:
          - name: internal-gateway
            namespace: networking
        hostnames:
          - "${GATUS_SUBDOMAIN}.home.${SECRET_DOMAIN}"
        rules:
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: rfc1918-ips
            backendRefs:
              - identifier: main
                port: http

    persistence:
      config:
        existingClaim: "${VOLSYNC_CLAIM}"
        advancedMounts:
          main:
            main:
              - path: /var/www/html/db
                subPath: db
              - path: /var/www/html/images/uploads/logos
                subPath: logos
      log:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /var/log
