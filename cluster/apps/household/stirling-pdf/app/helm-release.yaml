# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app stirling-pdf
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        containers:
          main:
            image:
              repository: stirlingtools/stirling-pdf
              tag: 3.0.0
            env:
              PUID: 568
              PGID: 568
              SECURITY_ENABLELOGIN: "true"
              SYSTEM_DEFAULTLOCALE: en-US
              SYSTEM_FRONTENDURL: "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"
              SYSTEM_SERVERCERTIFICATE_ENABLED: "true"
              JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1024m -XX:MaxMetaspaceSize=512m"
              MAIL_ENABLED: "true"
              MAIL_HOST: smtp-relay.system.svc.cluster.local
              MAIL_PORT: 2525
              MAIL_FROM: "pdf@${SECRET_DOMAIN}"
              MAIL_STARTTLSENABLE: "false"
              STORAGE_ENABLED: "true"
              STORAGE_LOCAL_BASEPATH: /storage
              STORAGE_SHARING_ENABLED: "true"
              STORAGE_SHARING_LINKENABLED: "true"
              STORAGE_SHARING_EMAILENABLED: "true"
              STORAGE_SIGNING_ENABLED: "true"
              SECURITY_LOGINMETHOD: oauth2
              SECURITY_OAUTH2_ENABLED: "true"
              SECURITY_OAUTH2_PROVIDER: pocketid
              SECURITY_OAUTH2_ISSUER: "https://id.${SECRET_DOMAIN}"
              SECURITY_OAUTH2_SCOPES: "openid, profile, email"
              SECURITY_OAUTH2_USEASUSERNAME: preferred_username
              SECURITY_OAUTH2_AUTOCREATEUSER: "true"
            envFrom:
              - secretRef:
                  name: stirling-pdf-oidc-credentials
            resources:
              requests:
                cpu: 50m
                memory: 1Gi
              limits:
                memory: 2Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    route:
      main:
        enabled: true
        annotations:
          gatus.io/enabled: "true"
        parentRefs:
          - name: external-gateway
            namespace: networking
        hostnames:
          - "${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"
        rules:
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: traefik-middleware-chain-no-auth
            backendRefs:
              - identifier: main
                port: http
    persistence:
      data:
        existingClaim: "${VOLSYNC_CLAIM}"
        advancedMounts:
          main:
            main:
              - subPath: configs
                path: /configs
              - subPath: customFiles
                path: /customFiles
              - subPath: storage
                path: /storage
