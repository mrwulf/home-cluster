---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: outline
spec:
  name: Outline
  pkceEnabled: true
  logo:
    # dashboard-icons' outline-light.svg is upstream-broken (white mark on
    # white badge, invisible in dark mode); their own metadata maps Outline's
    # dark-theme variant to this base file instead.
    darkLogoUrl: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/outline.webp
  launchUrl: https://docs.${SECRET_DOMAIN}/
  callbackUrls:
    - https://docs.${SECRET_DOMAIN}/auth/oidc.callback
  logoutCallbackUrls:
    - https://docs.${SECRET_DOMAIN}/
  allowedUserGroups:
    - name: users
      namespace: auth
  secret:
    name: outline-oidc-credentials
    keys:
      clientID: OIDC_CLIENT_ID
      clientSecret: OIDC_CLIENT_SECRET
