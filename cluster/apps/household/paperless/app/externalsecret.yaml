---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: paperless-secret
    template:
      data:
        # App
        PAPERLESS_ADMIN_USER: "{{ .username }}"
        PAPERLESS_ADMIN_PASSWORD: "{{ .password }}"
        PAPERLESS_SECRET_KEY: "{{ .PAPERLESS_SECRET_KEY }}"
        PAPERLESS_DBUSER: &dbUser "{{ .POSTGRES_USER }}"
        PAPERLESS_DBPASS: &dbPass "{{ .POSTGRES_PASS }}"
        PAPERLESS_DBNAME: &dbName paperless
        PAPERLESS_DBHOST: &dbHost postgres17-rw.databases.svc.cluster.local
        PAPERLESS_DBPORT: "5432"
        PAPERLESS_GMAIL_OAUTH_CLIENT_ID: "{{ .PAPERLESS_GMAIL_ID }}"
        PAPERLESS_GMAIL_OAUTH_CLIENT_SECRET: "{{ .PAPERLESS_GMAIL_SECRET }}"

        # Postgres Init
        INIT_POSTGRES_DBNAME: *dbName
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  data:
    - secretKey: POSTGRES_SUPER_PASS
      remoteRef:
        key: "Postgres SuperUser Credentials"
        property: "password"
    - secretKey: POSTGRES_USER
      remoteRef:
        key: "Paperless DB Credentials"
        property: "username"
    - secretKey: POSTGRES_PASS
      remoteRef:
        key: "Paperless DB Credentials"
        property: "password"
    - secretKey: username
      remoteRef:
        key: "Paperless Admin User Credentials"
        property: "username"
    - secretKey: password
      remoteRef:
        key: "Paperless Admin User Credentials"
        property: "password"
    - secretKey: PAPERLESS_SECRET_KEY
      remoteRef:
        key: "Paperless Admin User Credentials"
        property: "secret-key"
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
    - secretKey: PAPERLESS_GMAIL_ID
      remoteRef:
        key: "Paperless Admin User Credentials"
        property: "gmail-oauth-client-id"
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
    - secretKey: PAPERLESS_GMAIL_SECRET
      remoteRef:
        key: "Paperless Admin User Credentials"
        property: "gmail-oauth-client-secret"
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
