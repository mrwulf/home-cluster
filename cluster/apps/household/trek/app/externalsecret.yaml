---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trek
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: trek-secret
    template:
      data:
        ENCRYPTION_KEY: "{{ .ENCRYPTION_KEY }}"
        TREK_DB_URL: "postgres://{{ .POSTGRES_USER | urlquery }}:{{ .POSTGRES_PASS | urlquery }}@postgres17-rw.databases.svc.cluster.local:5432/trek?sslmode=disable"

        # Postgres Init
        INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: "Trek Service Credentials"
        property: "ENCRYPTION_KEY"
    - secretKey: POSTGRES_USER
      remoteRef:
        key: "Trek DB Credentials"
        property: "username"
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
    - secretKey: POSTGRES_PASS
      remoteRef:
        key: "Trek DB Credentials"
        property: "password"
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
