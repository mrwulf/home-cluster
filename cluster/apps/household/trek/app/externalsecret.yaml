---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trek
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: trek-secret
    template:
      data:
        ENCRYPTION_KEY: "{{ .ENCRYPTION_KEY }}"
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: "Trek Service Credentials"
        property: "ENCRYPTION_KEY"
