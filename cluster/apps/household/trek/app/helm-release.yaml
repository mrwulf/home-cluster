# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app trek
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      trek:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.7
            env:
              - name: INIT_POSTGRES_HOST
                value: postgres17-rw.databases.svc.cluster.local
              - name: INIT_POSTGRES_DBNAME
                value: trek
              - name: INIT_POSTGRES_SUPER_USER
                valueFrom:
                  secretKeyRef:
                    name: postgres-superuser
                    key: username
              - name: INIT_POSTGRES_SUPER_PASS
                valueFrom:
                  secretKeyRef:
                    name: postgres-superuser
                    key: password
              - name: INIT_POSTGRES_USER
                valueFrom:
                  secretKeyRef:
                    name: trek-secret
                    key: INIT_POSTGRES_USER
              - name: INIT_POSTGRES_PASS
                valueFrom:
                  secretKeyRef:
                    name: trek-secret
                    key: INIT_POSTGRES_PASS
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        containers:
          app:
            image:
              repository: mauriceboe/trek
              tag: 5.2.1
            env:
              NODE_ENV: production
              PORT: 3000
              APP_URL: https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}
              ALLOWED_ORIGINS: https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}
              ALLOW_INTERNAL_NETWORK: "true"
              TREK_PLUGIN_ALLOW_PRIVATE_EGRESS: "on"
              FORCE_HTTPS: "true"
              TRUST_PROXY: "1"
              OIDC_DISPLAY_NAME: "Home PocketID"
              OIDC_ONLY: "true"
              OIDC_SCOPE: "openid email profile groups"
              OIDC_ADMIN_CLAIM: "groups"
              OIDC_ADMIN_VALUE: "admin"
            envFrom:
              - secretRef:
                  name: trek-secret
              - secretRef:
                  name: trek-oidc-credentials
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      app:
        controller: trek
        ports:
          http:
            port: 3000

    route:
      app:
        enabled: true
        annotations:
          gatus.io/enabled: "true"
        parentRefs:
          - name: external-gateway
            namespace: networking
        hostnames:
          - "${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"
        rules:
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: traefik-middleware-chain-no-auth
            backendRefs:
              - identifier: app
                port: http

    configMaps:
      initdb:
        data:
          # postgres17 puts the pg_stat_statements views in every database's public
          # schema, and TREK refuses a first start or a move into a schema that holds
          # anything. The default search_path ("$user", public) picks this one instead.
          # postgres-init runs this only when it creates the database.
          trek.sql: |
            CREATE SCHEMA trek AUTHORIZATION trek;

    persistence:
      initdb:
        type: configMap
        identifier: initdb
        advancedMounts:
          trek:
            init-db:
              - path: /initdb/trek.sql
                subPath: trek.sql
                readOnly: true
      data:
        existingClaim: "${VOLSYNC_CLAIM}"
        advancedMounts:
          trek:
            app:
              - path: /app/data
                subPath: data
              - path: /app/uploads
                subPath: uploads
      tmp:
        type: emptyDir
        advancedMounts:
          trek:
            app:
              - path: /tmp
