# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app affine
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # init-db (postgres provisioning) is merged in via patches/postgres.yaml
          # and sorts before this one so the database exists first.
          migrate:
            image:
              repository: ghcr.io/toeverything/affine
              tag: "0.27.4"
            command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
            envFrom:
              - secretRef:
                  name: affine-secret
            env:
              DEPLOYMENT_TYPE: selfhosted
              REDIS_SERVER_HOST: dragonfly.databases.svc.cluster.local
              REDIS_SERVER_DATABASE: 7
        containers:
          main:
            image:
              repository: ghcr.io/toeverything/affine
              tag: "0.27.4"
            envFrom:
              - secretRef:
                  name: affine-secret
            env:
              DEPLOYMENT_TYPE: selfhosted
              REDIS_SERVER_HOST: dragonfly.databases.svc.cluster.local
              REDIS_SERVER_DATABASE: 7
              AFFINE_SERVER_HOST: affine.${SECRET_DOMAIN}
              AFFINE_SERVER_HTTPS: "true"
              AFFINE_SERVER_PORT: 3010
              AFFINE_SERVER_EXTERNAL_URL: https://affine.${SECRET_DOMAIN}
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi

    service:
      main:
        controller: main
        ports:
          http:
            port: 3010

    route:
      main:
        enabled: true
        annotations:
          gatus.io/enabled: "true"
        parentRefs:
          - name: external-gateway
            namespace: networking
        hostnames:
          - "affine.${SECRET_DOMAIN}"
        rules:
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: traefik-middleware-chain-no-auth
            backendRefs:
              - identifier: main
                port: http

    persistence:
      storage:
        type: emptyDir
        globalMounts:
          - path: /root/.affine/storage
      config:
        type: emptyDir
        globalMounts:
          - path: /root/.affine/config
