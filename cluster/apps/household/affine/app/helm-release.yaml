# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app affine
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # init-db (postgres provisioning) is merged in via patches/postgres.yaml.
          # bjw-s app-template sorts initContainers by key name, so ordering here
          # is: init-config, init-db, migrate.
          init-config:
            image:
              repository: alpine
              tag: 3.24.2
            command: ["/bin/sh", "-c"]
            args:
              - |
                cat <<EOF > /root/.affine/config/config.json
                {
                  "\$schema": "https://github.com/toeverything/affine/releases/latest/download/config.schema.json",
                  "server": {
                    "name": "AFFiNE Self-hosted",
                    "externalUrl": "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"
                  },
                  "oauth": {
                    "providers.oidc": {
                      "clientId": "$${OIDC_CLIENT_ID}",
                      "clientSecret": "$${OIDC_CLIENT_SECRET}",
                      "issuer": "https://id.${SECRET_DOMAIN}",
                      "args": {}
                    }
                  },
                  "storages": {
                    "blob.storage": {
                      "provider": "aws-s3",
                      "bucket": "affine",
                      "config": {
                        "endpoint": "https://cdn.${SECRET_DOMAIN}",
                        "region": "us-east-1",
                        "forcePathStyle": true,
                        "credentials": {
                          "accessKeyId": "$${MINIO_ACCESS_KEY}",
                          "secretAccessKey": "$${MINIO_SECRET_KEY}"
                        }
                      }
                    }
                  }
                }
                EOF
            envFrom:
              - secretRef:
                  name: affine-secret
              - secretRef:
                  name: affine-oidc-credentials
              - secretRef:
                  name: affine-minio-credentials
          migrate:
            image:
              repository: ghcr.io/toeverything/affine
              tag: "0.27.4"
            command:
              [
                "sh",
                "-c",
                ". /scripts/fix-private-key.sh && exec node ./scripts/self-host-predeploy.js",
              ]
            envFrom:
              - secretRef:
                  name: affine-secret
            env:
              DEPLOYMENT_TYPE: selfhosted
              REDIS_SERVER_HOST: dragonfly.databases.svc.cluster.local
              REDIS_SERVER_DATABASE: 7
        containers:
          main:
            image:
              repository: ghcr.io/toeverything/affine
              tag: "0.27.4"
            # docker-entrypoint.sh node ./dist/main.js is this image's own
            # default Entrypoint+Cmd - replicated here (rather than left
            # implicit) because fix-private-key.sh must run first.
            command:
              [
                "sh",
                "-c",
                ". /scripts/fix-private-key.sh && exec docker-entrypoint.sh node ./dist/main.js",
              ]
            envFrom:
              - secretRef:
                  name: affine-secret
            env:
              DEPLOYMENT_TYPE: selfhosted
              REDIS_SERVER_HOST: dragonfly.databases.svc.cluster.local
              REDIS_SERVER_DATABASE: 7
              AFFINE_SERVER_HOST: "${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"
              AFFINE_SERVER_HTTPS: "true"
              AFFINE_SERVER_PORT: 3010
              AFFINE_SERVER_EXTERNAL_URL: "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi

    service:
      main:
        controller: main
        ports:
          http:
            port: 3010

    route:
      main:
        enabled: true
        annotations:
          gatus.io/enabled: "true"
        parentRefs:
          - name: external-gateway
            namespace: networking
        hostnames:
          - "${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}"
        rules:
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: traefik-middleware-chain-no-auth
            backendRefs:
              - identifier: main
                port: http

    persistence:
      fix-private-key:
        type: configMap
        name: affine-fix-private-key
        defaultMode: 0555
        advancedMounts:
          main:
            migrate:
              - path: /scripts/fix-private-key.sh
                subPath: fix-private-key.sh
                readOnly: true
            main:
              - path: /scripts/fix-private-key.sh
                subPath: fix-private-key.sh
                readOnly: true
      config:
        type: emptyDir
        advancedMounts:
          main:
            init-config:
              - path: /root/.affine/config
            migrate:
              - path: /root/.affine/config
            main:
              - path: /root/.affine/config
      storage:
        type: emptyDir
        globalMounts:
          - path: /root/.affine/storage
