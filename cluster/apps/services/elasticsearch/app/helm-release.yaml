# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: elasticsearch
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        # RWO volume, so never run two pods against it during a rollout.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          main:
            image:
              # Pinned to 7.x: Temporal is configured for ES_VERSION=v7 (see Renovate rule).
              repository: docker.io/library/elasticsearch
              tag: 7.17.27
            env:
              discovery.type: single-node
              # Cluster-internal and only reached by Temporal.
              xpack.security.enabled: "false"
              ES_JAVA_OPTS: -Xms256m -Xmx256m
              # Talos keeps vm.max_map_count at the kernel default, too low for mmapfs.
              node.store.allow_mmap: "false"
              cluster.routing.allocation.disk.threshold_enabled: "true"
              cluster.routing.allocation.disk.watermark.low: 512mb
              cluster.routing.allocation.disk.watermark.high: 256mb
              cluster.routing.allocation.disk.watermark.flood_stage: 128mb
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9200
                  periodSeconds: 5
                  failureThreshold: 36
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9200
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 6
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 1Gi

    service:
      main:
        controller: main
        ports:
          http:
            port: 9200

    persistence:
      data:
        existingClaim: "${VOLSYNC_CLAIM}"
        advancedMounts:
          main:
            main:
              # subPath keeps the ext4 lost+found directory out of the data path.
              - path: /usr/share/elasticsearch/data
                subPath: data
