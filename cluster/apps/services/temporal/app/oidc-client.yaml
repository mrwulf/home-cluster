---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: temporal
spec:
  name: Temporal
  # Deviation from this repo's PKCE-by-default convention: temporal-ui 2.58.0's
  # OIDC client doesn't send a code_challenge (PKCE support is an open,
  # unmerged PR - temporalio/ui#3492). It's a confidential client (holds a
  # client secret), so disabling PKCE is the n8n-style exception, not a
  # security gap for a public client.
  pkceEnabled: false
  launchUrl: https://temporal.home.${SECRET_DOMAIN}/
  callbackUrls:
    - https://temporal.home.${SECRET_DOMAIN}/auth/sso/callback
  allowedUserGroups:
    - name: users
      namespace: auth
  secret:
    name: temporal-oidc-credentials
    keys:
      clientID: TEMPORAL_AUTH_CLIENT_ID
      clientSecret: TEMPORAL_AUTH_CLIENT_SECRET
