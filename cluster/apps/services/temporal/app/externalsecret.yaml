---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: temporal
    template:
      data:
        POSTGRES_USER: "{{ .username }}"
        POSTGRES_PWD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: "Temporal DB Credentials"
        property: "username"
    - secretKey: password
      remoteRef:
        key: "Temporal DB Credentials"
        property: "password"
