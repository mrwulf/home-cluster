# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app temporal
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          dnsConfig:
            options:
              - name: ndots
                value: "1"
        initContainers:
          # Temporal wants two databases (main + visibility) with their own
          # schema_version tables, so the shared init image runs once per DB.
          init-db:
            image: &init-image
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6
            env:
              - name: INIT_POSTGRES_HOST
                value: postgres17-rw.databases.svc.cluster.local
              - name: INIT_POSTGRES_DBNAME
                value: temporal
              - name: INIT_POSTGRES_SUPER_USER
                valueFrom:
                  secretKeyRef:
                    name: postgres-superuser
                    key: username
              - name: INIT_POSTGRES_SUPER_PASS
                valueFrom:
                  secretKeyRef:
                    name: postgres-superuser
                    key: password
              - name: INIT_POSTGRES_USER
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: POSTGRES_USER
              - name: INIT_POSTGRES_PASS
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: POSTGRES_PWD
          init-db-visibility:
            image: *init-image
            env:
              - name: INIT_POSTGRES_HOST
                value: postgres17-rw.databases.svc.cluster.local
              - name: INIT_POSTGRES_DBNAME
                value: temporal_visibility
              - name: INIT_POSTGRES_SUPER_USER
                valueFrom:
                  secretKeyRef:
                    name: postgres-superuser
                    key: username
              - name: INIT_POSTGRES_SUPER_PASS
                valueFrom:
                  secretKeyRef:
                    name: postgres-superuser
                    key: password
              - name: INIT_POSTGRES_USER
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: POSTGRES_USER
              - name: INIT_POSTGRES_PASS
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: POSTGRES_PWD
        containers:
          main:
            image:
              repository: docker.io/temporalio/auto-setup
              tag: 1.28.4
            envFrom:
              - secretRef:
                  name: *app
            env:
              DB: postgres12
              DB_PORT: "5432"
              POSTGRES_SEEDS: postgres17-rw.databases.svc.cluster.local
              DBNAME: temporal
              VISIBILITY_DBNAME: temporal_visibility
              # The init containers above already created both databases.
              SKIP_DB_CREATE: "true"
              # SQL visibility, no Elasticsearch: plenty for a single-app homelab load.
              ENABLE_ES: "false"
              DEFAULT_NAMESPACE: default
              DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
              PROMETHEUS_ENDPOINT: 0.0.0.0:9090
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 7233
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 6
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi

      ui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: docker.io/temporalio/ui
              tag: 2.34.0
            env:
              TEMPORAL_ADDRESS: temporal.services.svc.cluster.local:7233
              TEMPORAL_UI_PORT: "8080"
            probes:
              liveness: &uiprobes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 6
              readiness: *uiprobes
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

    service:
      main:
        controller: main
        ports:
          grpc:
            port: 7233
          metrics:
            port: 9090
      ui:
        controller: ui
        ports:
          http:
            port: 8080

    route:
      ui:
        enabled: true
        annotations:
          gatus.io/enabled: "true"
        parentRefs:
          - name: internal-gateway
            namespace: networking
        hostnames:
          - "temporal.home.${SECRET_DOMAIN}"
        rules:
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: rfc1918-ips
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: traefik-middleware-chain-pocket-id
            backendRefs:
              - identifier: ui
                port: http

    serviceMonitor:
      main:
        # Two services exist (main + ui), so the target can't be auto-detected.
        service:
          identifier: main
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 30s
