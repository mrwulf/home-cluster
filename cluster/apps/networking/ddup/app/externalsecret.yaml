---
# Dedicated to ddup (rules 8/9): only what ddup needs. The Cloudflare token must be a NEW
# Zone > DNS > Edit token scoped to the one zone, separate from the `cloudflare-ddns` secret.
# Bitwarden item "ddup Service Credentials" must have the fields referenced below. The DDNS token must be
# a dedicated Zone > DNS > Edit token for the zone of the dynamic DNS record.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ddup
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: ddup
    template:
      data:
        CLOUDFLARE_API_TOKEN: "{{ .cloudflare_api_token }}"
        CLOUDFLARE_ZONE_ID: "{{ .cloudflare_zone_id }}"
        EMAIL_API_KEY: "{{ .email_api_key }}"
        EMAIL_FROM: "{{ .email_from }}"
        EMAIL_TO: "{{ .email_to }}"
        NTFY_TOKEN: "{{ .ntfy_token }}"
        # Dynamic DNS record, in another zone
        DDNS_CLOUDFLARE_API_TOKEN: "{{ .ddns_cloudflare_api_token }}"
        DDNS_CLOUDFLARE_ZONE_ID: "{{ .ddns_cloudflare_zone_id }}"
        DDNS_RECORD_NAME: "{{ .ddns_record_name }}"
  data:
    - secretKey: cloudflare_api_token
      remoteRef:
        key: &item "ddup Service Credentials"
        property: cloudflare_api_token
    - secretKey: cloudflare_zone_id
      remoteRef:
        key: *item
        property: cloudflare_zone_id
    - secretKey: email_api_key
      remoteRef:
        key: *item
        property: email_api_key
    - secretKey: email_from
      remoteRef:
        key: *item
        property: email_from
    - secretKey: email_to
      remoteRef:
        key: *item
        property: email_to
    - secretKey: ntfy_token
      remoteRef:
        key: *item
        property: ntfy_token
    - secretKey: ddns_cloudflare_api_token
      remoteRef:
        key: *item
        property: ddns_cloudflare_api_token
    - secretKey: ddns_cloudflare_zone_id
      remoteRef:
        key: *item
        property: ddns_cloudflare_zone_id
    # The record already exists in Bitwarden, where the old cloudflare-ddns CronJob read it from
    - secretKey: ddns_record_name
      remoteRef:
        key: "Cloudflare Credentials"
        property: ingress-ddns-record
