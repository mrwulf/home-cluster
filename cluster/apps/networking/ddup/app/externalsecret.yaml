---
# Dedicated to ddup (rules 8/9): only what ddup needs. Two NEW Cloudflare tokens, separate from the
# `cloudflare-ddns` secret and from each other: cloudflare_api_token = Zone > DNS > Edit on the one zone;
# cloudflare_email_api_token = Account > Email Sending > Edit (account that owns the onboarded sender domain).
# Bitwarden item "ddup Service Credentials" must have the fields referenced below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ddup
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: ddup
    template:
      data:
        CLOUDFLARE_API_TOKEN: "{{ .cloudflare_api_token }}"
        CLOUDFLARE_ZONE_ID: "{{ .cloudflare_zone_id }}"
        EMAIL_API_TOKEN: "{{ .cloudflare_email_api_token }}"
        EMAIL_URL: "https://api.cloudflare.com/client/v4/accounts/{{ .cloudflare_account_id }}/email/sending/send"
        EMAIL_FROM: "{{ .email_from }}"
        EMAIL_TO: "{{ .email_to }}"
        NTFY_TOKEN: "{{ .ntfy_token }}"
  data:
    - secretKey: cloudflare_api_token
      remoteRef:
        key: &item "ddup Service Credentials"
        property: cloudflare_api_token
    - secretKey: cloudflare_zone_id
      remoteRef:
        key: *item
        property: cloudflare_zone_id
    - secretKey: cloudflare_email_api_token
      remoteRef:
        key: *item
        property: cloudflare_email_api_token
    - secretKey: cloudflare_account_id
      remoteRef:
        key: *item
        property: cloudflare_account_id
    - secretKey: email_from
      remoteRef:
        key: *item
        property: email_from
    - secretKey: email_to
      remoteRef:
        key: *item
        property: email_to
    - secretKey: ntfy_token
      remoteRef:
        key: *item
        property: ntfy_token
