---
# Dedicated to ddup (rules 8/9): only what ddup needs. The Cloudflare token must be a NEW
# Zone:DNS:Edit token scoped to the one zone, separate from the `cloudflare-ddns` secret.
# Bitwarden item "ddup Credentials" must have the fields referenced below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ddup
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: ddup
    template:
      data:
        CLOUDFLARE_API_TOKEN: "{{ .cloudflare_api_token }}"
        CLOUDFLARE_ZONE_ID: "{{ .cloudflare_zone_id }}"
        EMAIL_API_KEY: "{{ .email_api_key }}"
        EMAIL_FROM: "{{ .email_from }}"
        EMAIL_TO: "{{ .email_to }}"
        NTFY_TOKEN: "{{ .ntfy_token }}"
  data:
    - secretKey: cloudflare_api_token
      remoteRef:
        key: "ddup Credentials"
        property: cloudflare_api_token
    - secretKey: cloudflare_zone_id
      remoteRef:
        key: "ddup Credentials"
        property: cloudflare_zone_id
    - secretKey: email_api_key
      remoteRef:
        key: "ddup Credentials"
        property: email_api_key
    - secretKey: email_from
      remoteRef:
        key: "ddup Credentials"
        property: email_from
    - secretKey: email_to
      remoteRef:
        key: "ddup Credentials"
        property: email_to
    - secretKey: ntfy_token
      remoteRef:
        key: "ddup Credentials"
        property: ntfy_token
