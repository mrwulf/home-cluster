---
# ddup config. Loaded once at startup (no hot reload); reloader restarts the pod on change.
# ${VAR} values are substituted by Flux at build time (not secret). Runtime secrets use the
# ddup `!env` tag / `{{ env "X" }}` template func, fed from the `ddup` ExternalSecret.
# ddup owns every record below (the failover Workers it replaced were removed on 2026-10-03): don't also
# manage them from the ingress-vps tofu stacks or anywhere else, or the two will fight over the record.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ddup
data:
  config.yaml: |
    interval: 30s

    # Two replicas: only the Lease holder updates DNS and sends webhooks. Namespace and identity come from the pod.
    leaderElection:
      enabled: true

    domains:
      # Replaces the VPS-primary `ingress.` record the failover Worker used to manage: both VPS IPs while
      # healthy (round-robin), the proxied Cloudflare Tunnel CNAME only when neither is. external-dns
      # points the apps on external-gateway-vps at this name.
      - recordName: "ingress-lb.${SECRET_DOMAIN}"
        provider: cloudflare
        ttl: 60
        healthChecks: &healthChecks
          timeout: "5s"
          attempts: 3
          recoverAfter: 3
          # Same probe as the failover Workers: the health responder answers 418
          method: "HEAD"
          expectStatus: ["418"]
        endpoints:
          # Probe by hostname (valid wildcard cert, resolves to the same single IP);
          # publish the IP from the tofu output
          - &vps-us
            name: "vps-us"
            url: "https://vps-us.${SECRET_DOMAIN}"
            ip: "${VPS_US_PUBLIC_IP}"
            priority: 0
          - &vps-eu
            name: "vps-eu"
            url: "https://vps-eu.${SECRET_DOMAIN}"
            ip: "${VPS_EU_PUBLIC_IP}"
            priority: 0
          # Fallback tier: a proxied CNAME to the Cloudflare Tunnel, probed through its own hostname
          - &tunnel
            name: "tunnel"
            url: "https://external.${SECRET_DOMAIN}"
            cname: "${SECRET_CLOUDFLARE_TUNNEL_ID}.cfargotunnel.com"
            proxied: true
            priority: 1

      # Replaces the tunnel-primary `fast.` record: the Cloudflare Tunnel while it's healthy,
      # the VPS IPs (round-robin) when it isn't. external-dns points the apps on external-gateway at this name.
      - recordName: "fast-lb.${SECRET_DOMAIN}"
        provider: cloudflare
        ttl: 60
        healthChecks: *healthChecks
        endpoints:
          - <<: *tunnel
            priority: 0
          - <<: *vps-us
            priority: 1
          - <<: *vps-eu
            priority: 1

      # Dynamic DNS for the home network, replacing the cloudflare-ddns CronJob: the record follows
      # the public IPv4 address this cluster reaches the internet from. The name is not in git
      # (DDNS_RECORD_NAME). No URL, so it's not health-checked: it's healthy while the lookup works.
      - recordName: !env DDNS_RECORD_NAME
        provider: cloudflare-ddns
        # Automatic TTL, like the old script's records
        ttl: 1
        healthChecks:
          timeout: "5s"
          attempts: 3
        endpoints:
          - name: "home"
            ipLookup:
              # Tried in order; the same services the old script used
              urls:
                - "https://ipv4.icanhazip.com"
                - "https://api.ipify.org"
              family: 4

    providers:
      cloudflare:
        cloudflare:
          apiToken: !env CLOUDFLARE_API_TOKEN
          zoneId: !env CLOUDFLARE_ZONE_ID
      # The dynamic DNS record lives in a different Cloudflare zone, with its own token
      cloudflare-ddns:
        cloudflare:
          apiToken: !env DDNS_CLOUDFLARE_API_TOKEN
          zoneId: !env DDNS_CLOUDFLARE_ZONE_ID

    webhooks:
      - name: "ntfy"
        # In-cluster ntfy; default access is deny-all, so a token is required
        url: "http://ntfy.system.svc.cluster.local:80/ddup"
        events: ["dns_updated", "dns_update_failed", "all_unhealthy"]
        headers:
          Authorization: 'Bearer {{ env "NTFY_TOKEN" }}'
          Title: "ddup: {{ .Subject }}"
          # Green, yellow or red circle for the health of the domain (healthy, warning when some endpoints
          # are down, unhealthy), like Gatus; urgent when nothing is healthy
          Tags: "{{ .StatusTag }}"
          Priority: '{{ if eq .Status "unhealthy" }}high{{ else }}default{{ end }}'
        body: '{{ .Text }}'
        attempts: 5
        timeout: "10s"
      # Resend HTTP email API (https://resend.com/docs/api-reference/emails/send-email)
      - name: "email"
        url: "https://api.resend.com/emails"
        events: ["dns_updated", "dns_update_failed", "all_unhealthy"]
        headers:
          Authorization: 'Bearer {{ env "EMAIL_API_KEY" }}'
          Content-Type: "application/json"
        body: '{"from": {{ json (env "EMAIL_FROM") }}, "to": [{{ json (env "EMAIL_TO") }}], "subject": {{ json (printf "[ddup] %s" .Subject) }}, "text": {{ json .Text }}}'

    server:
      enabled: true
      bind: "0.0.0.0"
      port: 7401
