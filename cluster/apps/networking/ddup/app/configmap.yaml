---
# ddup config. Loaded once at startup (no hot reload); reloader restarts the pod on change.
# ${VAR} values are substituted by Flux at build time (not secret). Runtime secrets are read from files
# (the `ddup` ExternalSecret mounted at /etc/ddup/secrets) with `!file`.
# ddup owns every record below (the failover Workers it replaced were removed on 2026-10-03): don't also
# manage them from the ingress-vps tofu stacks or anywhere else, or the two will fight over the record.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ddup
data:
  config.yaml: |
    interval: 30s

    # Two replicas: only the Lease holder updates DNS and sends notifications. Namespace and identity come from the pod.
    leaderElection:
      enabled: true

    domains:
      # Replaces the VPS-primary `ingress.` record the failover Worker used to manage: both VPS IPs while
      # healthy (round-robin), the proxied Cloudflare Tunnel CNAME only when neither is. external-dns
      # points the apps on external-gateway-vps at this name.
      - recordName: "ingress-lb.${SECRET_DOMAIN}"
        provider: cloudflare
        ttl: 60
        healthChecks: &healthChecks
          timeout: "5s"
          attempts: 3
          recoverAfter: 3
          # Same probe as the failover Workers: the health responder answers 418
          method: "HEAD"
          expectStatus: "418"
        endpoints:
          # Probe by hostname (valid wildcard cert, resolves to the same single IP);
          # publish the IP from the tofu output
          - &vps-us
            name: "vps-us"
            url: "https://vps-us.${SECRET_DOMAIN}"
            ip: "${VPS_US_PUBLIC_IP}"
            priority: 0
          - &vps-eu
            name: "vps-eu"
            url: "https://vps-eu.${SECRET_DOMAIN}"
            ip: "${VPS_EU_PUBLIC_IP}"
            priority: 0
          # Fallback tier: a proxied CNAME to the Cloudflare Tunnel, probed through its own hostname
          - &tunnel
            name: "tunnel"
            url: "https://external.${SECRET_DOMAIN}"
            cname: "${SECRET_CLOUDFLARE_TUNNEL_ID}.cfargotunnel.com"
            providerOptions:
              cloudflare:
                proxied: true
            priority: 1

      # Replaces the tunnel-primary `fast.` record: the Cloudflare Tunnel while it's healthy,
      # the VPS IPs (round-robin) when it isn't. external-dns points the apps on external-gateway at this name.
      - recordName: "fast-lb.${SECRET_DOMAIN}"
        provider: cloudflare
        ttl: 60
        healthChecks: *healthChecks
        endpoints:
          - <<: *tunnel
            priority: 0
          - <<: *vps-us
            priority: 1
          - <<: *vps-eu
            priority: 1

      # Dynamic DNS for the home network, replacing the cloudflare-ddns CronJob: the record follows
      # the public IPv4 address this cluster reaches the internet from. The name is not in git
      # (the DDNS_RECORD_NAME secret). No URL, so it's not health-checked: it's healthy while the lookup works.
      - recordName: !file /etc/ddup/secrets/DDNS_RECORD_NAME
        provider: cloudflare-ddns
        # Automatic TTL, like the old script's records
        ttl: 1
        healthChecks:
          timeout: "5s"
          attempts: 3
        endpoints:
          - name: "home"
            ipLookupFamily: 4
            # Asked at the same time (not in order): the first valid answer wins, and a warning is logged if they differ
            # https only, redirects are not followed, and the lookup ignores HTTP_PROXY
            ipLookupURLs:
              - url: "https://ipv4.icanhazip.com"
              - url: "https://api.ipify.org"

    providers:
      cloudflare:
        cloudflare:
          apiToken: !file /etc/ddup/secrets/CLOUDFLARE_API_TOKEN
          zoneId: !file /etc/ddup/secrets/CLOUDFLARE_ZONE_ID
      # The dynamic DNS record lives in a different Cloudflare zone, with its own token
      cloudflare-ddns:
        cloudflare:
          apiToken: !file /etc/ddup/secrets/DDNS_CLOUDFLARE_API_TOKEN
          zoneId: !file /etc/ddup/secrets/DDNS_CLOUDFLARE_ZONE_ID

    notifications:
      webhooks:
        - name: "ntfy"
          # ntfy is a webhook format: the URL includes the topic
          format: "ntfy"
          # In-cluster ntfy; default access is deny-all, so a token is required
          url: "http://ntfy.system.svc.cluster.local:80/ddup"
          # The bare token: ddup adds "Bearer "
          token: !file /etc/ddup/secrets/NTFY_TOKEN
          # Required: the destination is a private (in-cluster) address, which is blocked by default
          allowPrivateDestinations: true
          events: ["dns_updated", "dns_update_failed", "all_unhealthy"]
          # Same delivery window as the webhook had (fixed interval instead of a backoff)
          timeout: "10s"
          maxAttempts: 5
          retryInterval: "2s"
      email:
        # Through the in-cluster relay (maddy: tls off, no authentication): the sender must be on a domain the relay allows
        - name: "email"
          connectionString: !file /etc/ddup/secrets/EMAIL_CONNECTION_STRING
          to:
            - !file /etc/ddup/secrets/EMAIL_TO
          events: ["dns_updated", "dns_update_failed", "all_unhealthy"]

    server:
      enabled: true
      bind: "0.0.0.0"
      port: 7401
