---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: towonel-hub-secrets
  namespace: networking
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: towonel-hub-secrets
    template:
      data:
        # Postgres Init & App Database
        INIT_POSTGRES_DBNAME: "towonel"
        INIT_POSTGRES_HOST: "postgres17-rw.databases.svc.cluster.local"
        INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        DATABASE_URL: "postgres://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASS }}@postgres17-rw.databases.svc.cluster.local:5432/towonel?sslmode=disable"

        # OIDC & Feature Flags
        TOWONEL_HUB_OIDC_ISSUER_URL: "https://id.${SECRET_DOMAIN}"
        TOWONEL_HUB_WEB_CONSOLE: "true"
        TOWONEL_HUB_METRICS_ENABLED: "true"
  data:
    - secretKey: POSTGRES_SUPER_PASS
      remoteRef:
        key: "Postgres SuperUser Credentials"
        property: "password"
    - secretKey: POSTGRES_USER
      remoteRef:
        key: "Towonel DB Credentials"
        property: "username"
    - secretKey: POSTGRES_PASS
      remoteRef:
        key: "Towonel DB Credentials"
        property: "password"
