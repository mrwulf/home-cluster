---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: towonel-hub-secrets
  namespace: networking
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: towonel-hub-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Postgres Init Container Credentials
        INIT_POSTGRES_DBNAME: "towonel"
        INIT_POSTGRES_HOST: "postgres17-rw.databases.svc.cluster.local"
        INIT_POSTGRES_USER: "towonel"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"

        # Official Towonel Hub Configuration
        TOWONEL_HUB_DB_DRIVER: "postgres"
        TOWONEL_HUB_DB_DSN: "postgresql://towonel:{{ .POSTGRES_PASS }}@postgres17-rw.databases.svc.cluster.local:5432/towonel?sslmode=disable"
        TOWONEL_HUB_WEB_ENABLED: "true"
        TOWONEL_HUB_PUBLIC_URL: "https://towonel.home.${SECRET_DOMAIN}"
        TOWONEL_HUB_OIDC_ISSUER_URL: "https://id.${SECRET_DOMAIN}"
  data:
    - secretKey: POSTGRES_SUPER_PASS
      remoteRef:
        key: "Postgres SuperUser Credentials"
        property: "password"
    - secretKey: POSTGRES_PASS
      remoteRef:
        key: "Towonel Service Credentials"
        property: "password"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: towonel-hub-fields
  namespace: networking
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: towonel-hub-secrets
    creationPolicy: Merge
    template:
      engineVersion: v2
      data:
        TOWONEL_HUB_OPERATOR_API_KEY: "{{ .api_key }}"
  data:
    - secretKey: api_key
      remoteRef:
        key: "Towonel Service Credentials"
        property: "api_key"
