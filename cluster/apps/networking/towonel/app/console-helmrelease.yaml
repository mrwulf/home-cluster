apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: towonel-console
  namespace: networking
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    controllers:
      towonel-console:
        strategy: RollingUpdate
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: depName=codeberg.org/towonel/towonel-console datasource=docker
              repository: codeberg.org/towonel/towonel-console
              tag: 0.2.0
            env:
              NODE_ENV: production
              HOST: 0.0.0.0
              PORT: "3000"
              TOWONEL_HUB_URL: http://towonel-hub-towonel-node.networking.svc.cluster.local:8443
              TOWONEL_VM_URL: http://vmsingle-stack.monitoring.svc.cluster.local:8428
              TOWONEL_PUBLIC_REGIONS: US,EU
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket: { port: 3000 }
                  periodSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket: { port: 3000 }
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket: { port: 3000 }
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - "ALL"
    service:
      app:
        controller: towonel-console
        ports:
          http:
            port: 3000
    route:
      app:
        enabled: true
        parentRefs:
          - name: internal-gateway
            namespace: networking
        hostnames:
          - "towonel.home.${SECRET_DOMAIN}"
        rules:
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: rfc1918-ips
            backendRefs:
              - identifier: app
                port: http
