---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: towonel-traffic-analytics
  namespace: networking
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: networking
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
  json: |
    {
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus",
          "description": "",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 0 },
          "id": 5,
          "title": "Data Used in Last 30 Days (per Edge)",
          "type": "stat",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 500000000000 },
                  { "color": "orange", "value": 1000000000000 },
                  { "color": "red", "value": 2000000000000 }
                ]
              },
              "unit": "decbytes"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "editorMode": "code",
              "expr": "sum(increase(towonel_edge_bytes_in_total{job=~\"towonel-edge-.*\"}[30d]) + increase(towonel_edge_bytes_out_total{job=~\"towonel-edge-.*\"}[30d])) by (job)",
              "legendFormat": "{{job}} Total",
              "range": true
            }
          ]
        },
        {
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 0 },
          "id": 6,
          "title": "30-Day Edge Transfer Breakdown (Inbound / Outbound)",
          "type": "bargauge",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {},
              "unit": "decbytes"
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "minVizHeight": 10,
            "minVizWidth": 0,
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "editorMode": "code",
              "expr": "sum(increase(towonel_edge_bytes_in_total{job=~\"towonel-edge-.*\"}[30d])) by (job)",
              "legendFormat": "{{job}} - Inbound",
              "range": true
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "editorMode": "code",
              "expr": "sum(increase(towonel_edge_bytes_out_total{job=~\"towonel-edge-.*\"}[30d])) by (job)",
              "legendFormat": "{{job}} - Outbound",
              "range": true
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "id": 7,
          "title": "Edge Daily Transfer Trend (30 Days)",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "lineInterpolation": "linear",
                "barAlignment": 0,
                "fillOpacity": 80,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "unit": "decbytes"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "editorMode": "code",
              "expr": "sum(increase(towonel_edge_bytes_in_total{job=~\"towonel-edge-.*\"}[1d]) + increase(towonel_edge_bytes_out_total{job=~\"towonel-edge-.*\"}[1d])) by (job)",
              "legendFormat": "{{job}}",
              "range": true
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "id": 1,
          "title": "Towonel Network Throughput (Mbps)",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 10
              },
              "unit": "Mbits"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "editorMode": "code",
              "expr": "sum(rate(towonel_agent_bytes_total[5m])) by (direction) * 8 / 1000000",
              "legendFormat": "{{direction}}",
              "range": true
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 14 },
          "id": 2,
          "title": "Total Data Transferred (24h)",
          "type": "barchart",
          "fieldConfig": {
            "defaults": {
              "custom": {},
              "unit": "decbytes"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "editorMode": "code",
              "expr": "sum(increase(towonel_agent_bytes_total[24h])) by (direction)",
              "legendFormat": "{{direction}}",
              "range": true
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 10, "x": 8, "y": 14 },
          "id": 3,
          "title": "Traefik Ingress Request Rates per Service",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth"
              },
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "editorMode": "code",
              "expr": "sum(rate(traefik_service_requests_total{namespace=\"networking\"}[5m])) by (service)",
              "legendFormat": "{{service}}",
              "range": true
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 14 },
          "id": 4,
          "title": "Towonel Edge Session Status",
          "type": "stat",
          "fieldConfig": {
            "defaults": {
              "custom": {},
              "unit": "short"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "editorMode": "code",
              "expr": "towonel_agent_edge_session_state",
              "legendFormat": "Session State",
              "range": true
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["towonel", "networking", "traffic"],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "title": "Towonel - Traffic Throughput & Cost Demand Analytics"
    }
