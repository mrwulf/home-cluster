# ==============================================================================
# Standalone Fallback NetBird Client (Connected to NetBird Cloud)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-cloud-client
  namespace: networking
  labels:
    app.kubernetes.io/name: netbird-cloud-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: netbird-cloud-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbird-cloud-client
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: netbird-cloud-client
      initContainers:
        - name: resolv-conf
          # renovate: depName=ghcr.io/netbirdio/netbird datasource=docker
          image: ghcr.io/netbirdio/netbird:0.77.1@sha256:66f408b0c423e9c3376deea7bc0da78024d32494dd0f957344993015b74c4451
          command:
            - sh
            - -c
            - cp /etc/resolv.conf /tmp/resolv.conf && cp /etc/resolv.conf /tmp/resolv.conf.original.netbird
          volumeMounts:
            - name: resolv-conf
              mountPath: /tmp
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: netbird
          # renovate: depName=ghcr.io/netbirdio/netbird datasource=docker
          image: ghcr.io/netbirdio/netbird:0.77.1@sha256:66f408b0c423e9c3376deea7bc0da78024d32494dd0f957344993015b74c4451
          env:
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-control-plane-secrets
                  key: NB_CLOUD_SETUP_KEY
            - name: NB_MANAGEMENT_URL
              value: "https://api.netbird.io:443"
            - name: NB_LOG_LEVEL
              value: info
            - name: NB_LOG_FILE
              value: console
            - name: NB_DAEMON_ADDR
              value: unix:///var/run/netbird/netbird.sock
            - name: NB_ENTRYPOINT_SERVICE_TIMEOUT
              value: "0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_RESOURCE
                - SYS_ADMIN
          volumeMounts:
            - name: netbird-run
              mountPath: /var/run/netbird
            - name: netbird-lib
              mountPath: /var/lib/netbird
            - name: ssh-etc
              mountPath: /etc/ssh
            - name: resolv-conf
              mountPath: /etc/resolv.conf
              subPath: resolv.conf
            - name: resolv-conf
              mountPath: /etc/resolv.conf.original.netbird
              subPath: resolv.conf.original.netbird
          readinessProbe:
            exec:
              command:
                - netbird
                - status
                - --check
                - ready
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 1
          startupProbe:
            exec:
              command:
                - netbird
                - status
                - --check
                - startup
            initialDelaySeconds: 1
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 1
      volumes:
        - name: netbird-run
          emptyDir: {}
        - name: netbird-lib
          emptyDir: {}
        - name: ssh-etc
          emptyDir: {}
        - name: resolv-conf
          emptyDir: {}
