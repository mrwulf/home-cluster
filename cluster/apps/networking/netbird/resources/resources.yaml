  namespace: networking
  annotations:
    netbird.io/policy: "k8s-nodes-policy"
spec:
  name: "K8s Nodes Talos Subnet"
  address: 10.0.1.51/29
  networkID: ${NETBIRD_SELFHOSTED_NETWORK_ID:-da8gl8fbkucc73a14du0}
  groups:
    - routing-peers
  policySourceGroups:
    - "admin"
---
apiVersion: netbird.io/v1
