---
# ==============================================================================
# NetBird Declarative Resources & Operational Manual Assumptions
# ==============================================================================
# MANUAL DASHBOARD ASSUMPTIONS (NetBird Web Console Requirements):
# 1. SETUP KEY AUTO-GROUPS:
#    - In the NetBird Web Console (Setup Keys -> k8s-setup-key), the key MUST
#      have 'Auto-Groups' set to include 'Routing Peers'.
#    - Rationale: NetworkRouter peer pods (networkrouter-k8s-...) join via this
#      setup key. Auto-assigning 'Routing Peers' ensures that access policies
#      targeting 'destinationGroups: [routing-peers]' automatically match the
#      cluster routing peers upon registration without traffic drop.
#
# 2. ENVIRONMENT & SECRET SUBSTITUTIONS:
#    - ${SECRET_DOMAIN}: Global cluster root domain
#    - ${CORE_NFS_SERVER}: Primary NFS storage host IP
#    - ${GATEWAY_ADDR}: Default network gateway IP
#    - ${NETBIRD_SELFHOSTED_NETWORK_ID:-da8gl8fbkucc73a14du0}: NetBird Cloud Network UUID
# ==============================================================================

# ==============================================================================
# Setup Keys (NBSetupKey)
# ==============================================================================
# NOTE: Ensure 'Auto-Groups' on this key in NetBird Console includes 'Routing Peers'.
apiVersion: netbird.io/v1
kind: NBSetupKey
metadata:
  name: k8s-setup-key
  namespace: networking
spec:
  secretKeyRef:
    name: netbird-control-plane-secrets
    key: SETUP_KEY
---
apiVersion: netbird.io/v1
kind: NBSetupKey
metadata:
  name: opnsense-setup-key
  namespace: networking
spec:
  secretKeyRef:
    name: netbird-control-plane-secrets
    key: OPNSENSE_SETUP_KEY
---
# ==============================================================================
# Network Routers (NetworkRouter)
# ==============================================================================
apiVersion: netbird.io/v1alpha1
kind: NetworkRouter
metadata:
  name: k8s
  namespace: networking
spec:
  dnsZoneRef:
    name: "k8s.${SECRET_DOMAIN}"
  workloadOverride:
    replicas: 2
    podTemplate:
      spec:
        hostAliases:
          - ip: "${VPS_US_PUBLIC_IP}"
            hostnames:
              - "vps-us.${SECRET_DOMAIN}"
          - ip: "${VPS_EU_PUBLIC_IP}"
            hostnames:
              - "vps-eu.${SECRET_DOMAIN}"
        containers:
          - name: netbird
            env:
              - name: NB_MANAGEMENT_URL
                value: "http://netbird-management.networking.svc.cluster.local:8080"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
---
# ==============================================================================
# Declarative Peer & User Groups (NBGroup)
# ==============================================================================
apiVersion: netbird.io/v1
kind: NBGroup
metadata:
  name: admin
  namespace: networking
spec:
  name: "admin"
---
apiVersion: netbird.io/v1
kind: NBGroup
metadata:
  name: users
  namespace: networking
spec:
  name: "users"
---
apiVersion: netbird.io/v1
kind: NBGroup
metadata:
  name: work
  namespace: networking
spec:
  name: "Work"
---
apiVersion: netbird.io/v1
kind: NBGroup
metadata:
  name: non-work
  namespace: networking
spec:
  name: "Non-Work"
---
apiVersion: netbird.io/v1
kind: NBGroup
metadata:
  name: external-users
  namespace: networking
spec:
  name: "External-Users"
---
apiVersion: netbird.io/v1
kind: NBGroup
metadata:
  name: vps-peers
  namespace: networking
spec:
  name: "vps-peers"
---
apiVersion: netbird.io/v1
kind: NBGroup
metadata:
  name: routing-peers
  namespace: networking
spec:
  name: "routing-peers"
---
apiVersion: netbird.io/v1
kind: NBGroup
metadata:
  name: firewall-peers
  namespace: networking
spec:
  name: "Firewall Peers"
---
apiVersion: netbird.io/v1
kind: NBGroup
metadata:
  name: fullvpn
  namespace: networking
spec:
  name: "fullvpn"
---
apiVersion: netbird.io/v1
kind: NBGroup
metadata:
  name: fullvpn-users
  namespace: networking
spec:
  name: "FullVPN Users"
---
# ==============================================================================
# Declarative Network Resources (NBResource)
# ==============================================================================
# NOTE: netbird-operator automatically provisions a resource-specific access
# policy ('<Resource Name> Access') in NetBird Cloud for each NBResource.
apiVersion: netbird.io/v1
kind: NBResource
metadata:
  name: public-services
  namespace: networking
  annotations:
    netbird.io/policy: "public-sites-policy"
spec:
  name: "Public Services"
  address: "*.${SECRET_DOMAIN}"
  networkID: ${NETBIRD_SELFHOSTED_NETWORK_ID:-da8gl8fbkucc73a14du0}
  tcpPorts:
    - 443
  groups:
    - routing-peers
  policySourceGroups:
    - "users"
    - "vps-peers"
---
apiVersion: netbird.io/v1
kind: NBResource
metadata:
  name: private-services
  namespace: networking
  annotations:
    netbird.io/policy: "private-sites-policy"
spec:
  name: "Private Services"
  address: "*.home.${SECRET_DOMAIN}"
  networkID: ${NETBIRD_SELFHOSTED_NETWORK_ID:-da8gl8fbkucc73a14du0}
  tcpPorts:
    - 443
  groups:
    - routing-peers
  policySourceGroups:
    - "users"
---
apiVersion: netbird.io/v1
kind: NBResource
metadata:
  name: k8s-api-access
  namespace: networking
  annotations:
    netbird.io/policy: "k8s-api-policy"
spec:
  name: "k8s.home"
  address: "10.0.10.201/32"
  networkID: ${NETBIRD_SELFHOSTED_NETWORK_ID:-da8gl8fbkucc73a14du0}
  tcpPorts:
    - 6443
  groups:
    - routing-peers
  policySourceGroups:
    - "admin"
---
