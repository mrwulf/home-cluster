---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-selfhosted-operator-secrets
  namespace: netbird-selfhosted
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: netbird-selfhosted-operator-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MANAGEMENT_URL: "http://netbird-management.networking.svc.cluster.local:8080"
        NB_API_KEY: "{{ .NB_SELFHOSTED_API_KEY }}"
        SETUP_KEY: "{{ .K8S_SELFHOSTED_SETUP_KEY }}"
  data:
    - secretKey: NB_SELFHOSTED_API_KEY
      remoteRef:
        key: "Netbird Service Credentials"
        property: "NB_SELFHOSTED_API_KEY"
    - secretKey: K8S_SELFHOSTED_SETUP_KEY
      remoteRef:
        key: "Netbird Service Credentials"
        property: "K8S_SELFHOSTED_SETUP_KEY"
