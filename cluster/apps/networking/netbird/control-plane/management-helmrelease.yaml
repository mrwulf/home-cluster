---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbird-management
  namespace: networking
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    controllers:
      netbird-management:
        strategy: RollingUpdate
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              # renovate: depName=ghcr.io/home-operations/postgres-init datasource=docker
              repository: ghcr.io/home-operations/postgres-init
              tag: "18.6"
            securityContext:
              runAsUser: 65534
              runAsGroup: 65534
            envFrom:
              - secretRef:
                  name: netbird-control-plane-secrets
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
        containers:
          app:
            image:
              # renovate: depName=netbirdio/management datasource=docker
              repository: docker.io/netbirdio/management
              tag: latest
            command: ["/go/bin/netbird-mgmt"]
            args:
              [
                "management",
                "run",
                "--config",
                "/etc/netbird/management.json",
                "--log-file",
                "console",
              ]
            env:
              NETBIRD_STORE_CONFIG_ENGINE: postgres
              NETBIRD_AUTH_OIDC_ISSUER_URL: "https://id.${SECRET_DOMAIN}"
              NETBIRD_AUTH_OIDC_AUDIENCE: "netbird"
              NETBIRD_AUTH_SUPPORTED_SCOPES: "openid profile email"
              NETBIRD_AUTH_HTTP_REDIRECT_URL: "https://nb.${SECRET_DOMAIN}/callback"
              NETBIRD_NETWORK_NET: "100.110.0.0/16"
              NETBIRD_MGMT_API_PORT: "8080"
              NETBIRD_MGMT_METRICS_PORT: "9090"
            envFrom:
              - secretRef:
                  name: netbird-control-plane-secrets
              - secretRef:
                  name: netbird-oidc-credentials
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 15
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
    service:
      app:
        controller: netbird-management
        ports:
          http:
            port: 8080
          metrics:
            port: 9090
    persistence:
      config:
        type: emptyDir
        globalMounts:
          - path: /etc/netbird
