---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbird-control-plane
  namespace: networking
  annotations:
    external-dns.kubernetes.io/exclude: "true"
    gatus.io/enabled: "true"
    gatus.io/endpoint: |
      group: networking
spec:
  parentRefs:
    - name: external-gateway
      namespace: networking
    - name: netbird-gateway
      namespace: networking
  hostnames:
    - "nb.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: netbird-management
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /management.ManagementService
      backendRefs:
        - name: netbird-management
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /proxy.ProxyService
      backendRefs:
        - name: netbird-management
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /management.ProxyService
      backendRefs:
        - name: netbird-management
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /signalexchange.SignalExchange
      backendRefs:
        - name: netbird-signal
          port: 10000
    - matches:
        - path:
            type: PathPrefix
            value: /signal.SignalExchange
      backendRefs:
        - name: netbird-signal
          port: 10000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: netbird-dashboard
          port: 80
