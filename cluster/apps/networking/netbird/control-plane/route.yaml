---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbird-control-plane
  namespace: networking
  annotations:
    # Default (Cloudflare-proxied) path, same as every other app on external-gateway.
    # Previously pinned to external-gateway-vps because Cloudflare's proxy only passes
    # gRPC (management sync, signal exchange) through correctly with the account-level
    # gRPC toggle enabled - confirmed on in the dashboard (Network settings) 2026-09-01.
    # If clients start disconnecting while the control plane still reports them
    # connected, that's the known gRPC-streaming-through-proxy failure mode - revert
    # parentRefs to external-gateway-vps and restore cloudflare-proxied: "false".
    gatus.io/enabled: "true"
    gatus.io/endpoint: |
      group: networking
      path: /
spec:
  parentRefs:
    - name: external-gateway
      namespace: networking
  hostnames:
    - "nb.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: netbird-management
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /management.ManagementService
      backendRefs:
        - name: netbird-management
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /proxy.ProxyService
      backendRefs:
        - name: netbird-management
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /management.ProxyService
      backendRefs:
        - name: netbird-management
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /signalexchange.SignalExchange
      backendRefs:
        - name: netbird-signal
          port: 10000
    - matches:
        - path:
            type: PathPrefix
            value: /signal.SignalExchange
      backendRefs:
        - name: netbird-signal
          port: 10000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: netbird-dashboard
          port: 80
