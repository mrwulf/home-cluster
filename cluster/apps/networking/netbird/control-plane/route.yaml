---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbird-control-plane
  namespace: networking
  annotations:
    # gRPC (management sync, signal exchange) needs streaming/trailers that Cloudflare's
    # proxy only passes through correctly with its account-level gRPC support enabled;
    # keep this on the VPS/raw-TCP path rather than the Cloudflare-Tunnel-primary default
    # (see cluster/apps/networking/traefik/external/gateway.yaml) until that's confirmed.
    external-dns.kubernetes.io/target: "ingress.${SECRET_DOMAIN}"
    gatus.io/enabled: "true"
    gatus.io/endpoint: |
      group: networking
      path: /
spec:
  parentRefs:
    - name: external-gateway
      namespace: networking
  hostnames:
    - "nb.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: netbird-management
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /management.ManagementService
      backendRefs:
        - name: netbird-management
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /proxy.ProxyService
      backendRefs:
        - name: netbird-management
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /management.ProxyService
      backendRefs:
        - name: netbird-management
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /signalexchange.SignalExchange
      backendRefs:
        - name: netbird-signal
          port: 10000
    - matches:
        - path:
            type: PathPrefix
            value: /signal.SignalExchange
      backendRefs:
        - name: netbird-signal
          port: 10000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: netbird-dashboard
          port: 80
