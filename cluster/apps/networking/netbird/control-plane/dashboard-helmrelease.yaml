---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbird-dashboard
  namespace: networking
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      netbird-dashboard:
        strategy: RollingUpdate
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: depName=netbirdio/dashboard datasource=docker
              repository: docker.io/netbirdio/dashboard
              tag: 2.91.0
            env:
              USE_AUTH0: "false"
              LETSENCRYPT_DOMAIN: "none"
              NETBIRD_MGMT_API_ENDPOINT: "https://nb.${SECRET_DOMAIN}"
              NETBIRD_MGMT_GRPC_API_ENDPOINT: "https://nb.${SECRET_DOMAIN}"
              AUTH_AUTHORITY: "https://id.${SECRET_DOMAIN}"
              AUTH_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: netbird-oidc-credentials
                    key: NETBIRD_AUTH_OIDC_CLIENT_ID
              AUTH_AUDIENCE:
                valueFrom:
                  secretKeyRef:
                    name: netbird-oidc-credentials
                    key: NETBIRD_AUTH_OIDC_CLIENT_ID
              AUTH_SUPPORTED_SCOPES: "openid profile email groups"
              AUTH_REDIRECT_URI: "/auth"
              AUTH_SILENT_REDIRECT_URI: "/silent-auth"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 5
                  periodSeconds: 15
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 5
                  periodSeconds: 10
            resources:
              requests:
                cpu: 20m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      app:
        controller: netbird-dashboard
        ports:
          http:
            port: 80
