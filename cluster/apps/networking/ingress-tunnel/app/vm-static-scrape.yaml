apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: towonel-metrics
  namespace: networking
spec:
  jobName: towonel
  targetEndpoints:
    - targets:
        - "vps-direct.${SECRET_DOMAIN}:9090"
      scheme: "http"
      path: "/metrics"
      interval: "30s"
    - targets:
        - "towonel-hub-towonel-node.networking.svc.cluster.local:9091"
      scheme: "http"
      path: "/metrics"
      interval: "30s"
    - targets:
        - "towonel-agent.networking.svc.cluster.local:9090"
      scheme: "http"
      path: "/metrics"
      interval: "30s"
