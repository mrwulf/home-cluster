---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vps-direct-health
  namespace: networking
spec:
  parentRefs:
    - name: external-gateway
      namespace: networking
  hostnames:
    - "vps-direct.${SECRET_DOMAIN}"
  rules:
    - backendRefs:
        - name: towonel-console
          port: 3000
