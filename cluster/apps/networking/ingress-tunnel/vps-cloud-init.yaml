#cloud-config
write_files:
  # 1. Write FRP Server Configuration (Preserved during parallel transition phase)
  - path: /etc/frp/frps.toml
    permissions: "0600"
    content: |
      bindPort = 8080
      auth.method = "token"
      auth.token = "${TUNNEL_HANDSHAKE_TOKEN}"

      # Enable Admin dashboard
      webServer.addr = "0.0.0.0"
      webServer.port = 7500
      webServer.user = "admin"
      webServer.password = "${TUNNEL_HANDSHAKE_TOKEN}"
      enablePrometheus = true

  # 2. Write Systemd Service File for FRPS
  - path: /etc/systemd/system/frps.service
    permissions: "0644"
    content: |
      [Unit]
      Description=FRP Server
      After=network.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/frps -c /etc/frp/frps.toml
      Restart=always
      RestartSec=3
      LimitNOFILE=1048576

      [Install]
      WantedBy=multi-user.target

  # 3. Write Systemd Container Service File for Towonel Edge
  - path: /etc/systemd/system/towonel-edge.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Towonel Edge Node Container
      After=docker.service netbird.service
      Requires=docker.service

      [Service]
      Restart=always
      RestartSec=5s
      ExecStartPre=-/usr/bin/docker rm -f towonel-edge
      # renovate: depName=codeberg.org/towonel/towonel-node datasource=docker
      ExecStart=/usr/bin/docker run --name towonel-edge --rm --net=host \
        -e TOWONEL_HUB_ENABLED=false \
        -e TOWONEL_EDGE_ENABLED=true \
        -e TOWONEL_EDGE_LISTEN_ADDR=0.0.0.0:443 \
        -e TOWONEL_EDGE_HUB_LINK_ADDR=towonel-hub-towonel-node.networking.svc.cluster.local:51444 \
        -e TOWONEL_EDGE_HUB_LINK_PSK=${TOWONEL_HUB_LINK_PSK} \
        -e TOWONEL_EDGE_ADVERTISED_ADDRESSES=vps-direct.${SECRET_DOMAIN}:443 \
        -e TOWONEL_EDGE_IROH_PORT=51810 \
        -e TOWONEL_EDGE_REGION=EU \
        codeberg.org/towonel/towonel-node:latest@sha256:0f2140c494cebd115ee2afa6afe57faae0248b6b08b30a9331fb74374a13f59d serve

      [Install]
      WantedBy=multi-user.target

  # 4. Write systemd-resolved configuration for upstream DNS
  - path: /etc/systemd/resolved.conf.d/dns.conf
    permissions: "0644"
    content: |
      [Resolve]
      DNS=1.1.1.1 185.12.64.2

runcmd:
  - |
    # renovate: depName=fatedier/frp datasource=github-releases
    set -- v0.70.1
    curl -L -H "User-Agent: Mozilla/5.0" -o /tmp/frp.tar.gz "https://github.com/fatedier/frp/releases/download/$1/frp_$${1#v}_linux_amd64.tar.gz"
    tar -xzf /tmp/frp.tar.gz -C /tmp/
    mv /tmp/frp_*_linux_amd64/frps /usr/local/bin/frps
    chmod +x /usr/local/bin/frps
    rm -rf /tmp/frp.tar.gz /tmp/frp_*_linux_amd64

  # 4. Install Docker & systemd-resolved
  - |
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y -o Dpkg::Options::="--force-confold" -o Dpkg::Options::="--force-confdef" docker.io docker-cli systemd-resolved
    systemctl enable systemd-resolved --now
    systemctl restart systemd-resolved
    systemctl enable docker --now

  # 5. Install and connect NetBird client on VPS
  - |
    curl -fsSL https://pkgs.netbird.io/install.sh | sh
    netbird up --setup-key "${NETBIRD_SETUP_KEY}" --enable-rosenpass --enable-ssh-root --allow-server-ssh --rosenpass-permissive --wireguard-port 51821

  # 6. Tune Linux TCP stack (BBR Congestion Control) for high throughput / video streaming
  - sysctl -w net.core.default_qdisc=fq
  - sysctl -w net.ipv4.tcp_congestion_control=bbr
  - echo "net.core.default_qdisc=fq" >> /etc/sysctl.conf
  - echo "net.ipv4.tcp_congestion_control=bbr" >> /etc/sysctl.conf

  # 7. Enable and start Towonel Edge (and disable FRPS on port 443)
  - systemctl daemon-reload
  - systemctl stop frps || true
  - systemctl disable frps || true
  - systemctl enable towonel-edge --now
