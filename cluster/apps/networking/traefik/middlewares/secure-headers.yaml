---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-middleware-secure-headers
spec:
  headers:
    # No accessControl* fields here on purpose: setting any of them makes
    # Traefik itself answer CORS preflight (OPTIONS) requests instead of
    # forwarding them to the backend, and without accessControlAllowOriginList
    # it always omits Access-Control-Allow-Origin - silently breaking preflight
    # for every app behind this chain, including apps (e.g. affine) with their
    # own working dynamic CORS logic. Let each app own its own CORS handling.
    hostsProxyHeaders:
      - "X-Forwarded-Host"
      - "X-Forwarded-For"
      - "X-Forwarded-Proto"
      - "X-GEO-City"
      - "Cf-Connecting-Ip"
      - "Cf-Ipcountry"
    stsPreload: true
    forceSTSHeader: true
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    referrerPolicy: "same-origin"
    contentSecurityPolicy: "block-all-mixed-content;upgrade-insecure-requests;"
    frameDeny: true
    customFrameOptionsValue: "SAMEORIGIN"
    contentTypeNosniff: true
    browserXssFilter: true
    customResponseHeaders:
      permissionsPolicy: "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
      X-Frame-Options: "SAMEORIGIN"
      X-Robots-Tag: "none,noindex,nofollow,noarchive,nosnippet,notranslate,noimageindex"
      X-Permitted-Cross-Domain-Policies: "none"
      X-Forwarded-Proto: "https"
      X-Powered-By: ""
      server: ""
      City: X-GEO-City
