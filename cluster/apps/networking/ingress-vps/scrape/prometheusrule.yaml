---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ingress-vps
  namespace: networking
  labels:
    app.kubernetes.io/name: ingress-vps
    app.kubernetes.io/instance: ingress-vps
spec:
  groups:
    - name: ingress-vps
      rules:
        - alert: IngressVPSTraefikDown
          annotations:
            summary: "Edge Ingress VPS Traefik is down"
            description: "Edge Ingress VPS Traefik instance {{ $labels.instance }} ({{ $labels.job }}) is unreachable or failing metrics scraping."
          expr: |
            up{job=~"ingress-vps-.*", service="traefik"} == 0
          for: 2m
          labels:
            severity: critical

        - alert: IngressVPSRelayDown
          annotations:
            summary: "Edge Ingress VPS NetBird Relay is down"
            description: "Edge Ingress VPS NetBird Relay instance {{ $labels.instance }} ({{ $labels.job }}) is unreachable or failing metrics scraping."
          expr: |
            up{job=~"ingress-vps-.*", service="netbird-relay"} == 0
          for: 2m
          labels:
            severity: critical

        - alert: IngressVPSNodeExporterDown
          annotations:
            summary: "Edge Ingress VPS Node Exporter is down"
            description: "Edge Ingress VPS host {{ $labels.instance }} ({{ $labels.job }}) is unreachable or node-exporter is down."
          expr: |
            up{job=~"ingress-vps-.*", service="node-exporter"} == 0
          for: 2m
          labels:
            severity: critical

        - alert: EdgeNodeHighCPU
          annotations:
            summary: "Edge Ingress VPS high CPU load"
            description: "Edge Ingress VPS {{ $labels.instance }} CPU utilization is above 90% for > 5m."
          expr: |
            100 - (avg by (instance, job) (rate(node_cpu_seconds_total{job=~"ingress-vps-.*", mode="idle"}[5m])) * 100) > 90
          for: 5m
          labels:
            severity: warning

        - alert: EdgeNodeHighMemory
          annotations:
            summary: "Edge Ingress VPS high memory usage"
            description: "Edge Ingress VPS {{ $labels.instance }} memory utilization is above 90%."
          expr: |
            (1 - (node_memory_MemAvailable_bytes{job=~"ingress-vps-.*"} / node_memory_MemTotal_bytes{job=~"ingress-vps-.*"})) * 100 > 90
          for: 5m
          labels:
            severity: warning

        - alert: EdgeNodeDiskRunningFull
          annotations:
            summary: "Edge Ingress VPS disk running out of space"
            description: "Edge Ingress VPS {{ $labels.instance }} root filesystem has less than 15% free space remaining."
          expr: |
            (node_filesystem_avail_bytes{job=~"ingress-vps-.*", mountpoint="/"} / node_filesystem_size_bytes{job=~"ingress-vps-.*", mountpoint="/"}) * 100 < 15
          for: 5m
          labels:
            severity: warning

        - alert: IngressVPSTerraformStateLocked
          annotations:
            summary: "Ingress VPS Terraform state has been locked for a long time"
            description: "Terraform resource {{ $labels.name }} has held its state lock for over 25m. tfstate.forceUnlock=auto should clear a stale lock automatically; a lock surviving this long points at something still applying, or the auto-unlock itself failing."
          expr: |
            tofu_resource_info{name=~"ingress-vps-.*", state_locked="True"}
          for: 25m
          labels:
            severity: critical

        - alert: IngressVPSTerraformNotReady
          annotations:
            summary: "Ingress VPS Terraform resource failing to reconcile"
            description: "Terraform resource {{ $labels.name }} has been Ready=False for over 15m - check `kubectl get terraform {{ $labels.name }} -n {{ $labels.exported_namespace }}` and the tf-runner pod logs."
          expr: |
            tofu_resource_info{name=~"ingress-vps-.*", ready="False"}
          for: 15m
          labels:
            severity: warning

        - alert: IngressVPSTerraformFlapping
          annotations:
            summary: "Ingress VPS Terraform resource repeatedly failing to apply"
            description: "Terraform resource {{ $labels.name }} has racked up {{ $value }} consecutive reconciliation failures."
          expr: |
            tofu_reconciliation_failures{name=~"ingress-vps-.*"} > 3
          for: 10m
          labels:
            severity: warning
