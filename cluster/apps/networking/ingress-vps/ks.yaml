---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress-vps
  namespace: flux-system
spec:
  targetNamespace: networking
  path: ./cluster/apps/networking/ingress-vps/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 1h
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress-vps-scrape
  namespace: flux-system
spec:
  dependsOn:
    - name: ingress-vps
  targetNamespace: networking
  path: ./cluster/apps/networking/ingress-vps/scrape
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: true
      - kind: Secret
        name: cluster-secrets
        optional: true
      - kind: Secret
        name: vps-us-output
        optional: true
      - kind: Secret
        name: vps-eu-output
        optional: true
