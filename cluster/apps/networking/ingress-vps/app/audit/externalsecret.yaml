---
# Scoped to the audit job: read-only intent, but only the provider credentials it needs
# (not the NetBird/WireGuard/Cloudflare material in ingress-tunnel-secrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ingress-vps-audit-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: ingress-vps-audit-secrets
  refreshInterval: 15m
  data:
    - secretKey: HCLOUD_TOKEN
      remoteRef:
        key: "Hetzner Credentials"
        property: tofu_api_token
    - secretKey: OVH_ENDPOINT
      remoteRef:
        key: "OVH Credentials"
        property: endpoint
    - secretKey: OVH_APPLICATION_KEY
      remoteRef:
        key: "OVH Credentials"
        property: application_key
    - secretKey: OVH_APPLICATION_SECRET
      remoteRef:
        key: "OVH Credentials"
        property: application_secret
    - secretKey: OVH_CONSUMER_KEY
      remoteRef:
        key: "OVH Credentials"
        property: consumer_key
    - secretKey: OVH_SERVICE_NAME
      remoteRef:
        key: "OVH Credentials"
        property: service_name
