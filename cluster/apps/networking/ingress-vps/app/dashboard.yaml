---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ingress-vps-traffic-analytics
  namespace: networking
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: networking
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
  json: |
    {
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus",
          "description": "",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "annotations": {
        "list": [
          {
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
            "enable": true,
            "expr": "changes((count(up{job=~\"ingress-vps-.*\", service=\"traefik\"} == 1))[2m:15s]) > 0",
            "iconColor": "orange",
            "name": "Failover tier changed",
            "titleFormat": "Edge tier changed",
            "textFormat": "Number of healthy edge VPS nodes changed - check the Current Failover Tier panel",
            "step": "15s"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "title": "Edge Node CPU Usage",
          "type": "gauge",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 85 }
                ]
              },
              "unit": "percent"
            }
          },
          "options": {
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "100 - (avg by (job) (rate(node_cpu_seconds_total{job=~\"ingress-vps-.*\", mode=\"idle\"}[5m])) * 100)",
              "instant": true,
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "title": "Edge Node Memory Usage",
          "type": "gauge",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 75 },
                  { "color": "red", "value": 90 }
                ]
              },
              "unit": "percent"
            }
          },
          "options": {
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "(1 - (sum by (job) (node_memory_MemAvailable_bytes{job=~\"ingress-vps-.*\"}) / sum by (job) (node_memory_MemTotal_bytes{job=~\"ingress-vps-.*\"}))) * 100",
              "instant": true,
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "title": "Edge Root Disk Free",
          "type": "gauge",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 20 },
                  { "color": "green", "value": 35 }
                ]
              },
              "unit": "percent"
            }
          },
          "options": {
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "(sum by (job) (node_filesystem_avail_bytes{job=~\"ingress-vps-.*\", mountpoint=\"/\"}) / sum by (job) (node_filesystem_size_bytes{job=~\"ingress-vps-.*\", mountpoint=\"/\"})) * 100",
              "instant": true,
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "title": "Edge Traefik Status",
          "type": "stat",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "options": { "0": { "color": "red", "text": "DOWN" }, "1": { "color": "green", "text": "HEALTHY" } }, "type": "value" }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "max by (job) (up{job=~\"ingress-vps-.*\", service=\"traefik\"})",
              "instant": true,
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "id": 5,
          "title": "Edge Ingress Bandwidth - Aggregate (Mbps)",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 10 },
              "unit": "bps"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "sum by (job) (rate(node_network_receive_bytes_total{job=~\"ingress-vps-.*\", device!~\"lo|veth.*|docker.*\"}[5m])) * 8",
              "legendFormat": "{{job}} Inbound (RX)"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "sum by (job) (rate(node_network_transmit_bytes_total{job=~\"ingress-vps-.*\", device!~\"lo|veth.*|docker.*\"}[5m])) * 8",
              "legendFormat": "{{job}} Outbound (TX)"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "id": 6,
          "title": "Edge Traefik Request Rates (req/s)",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 15 },
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "sum by (entrypoint) (rate(traefik_entrypoint_requests_total{job=~\"ingress-vps-.*\"}[5m]))",
              "legendFormat": "Entrypoint: {{entrypoint}}"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 13 },
          "id": 7,
          "title": "Edge Interface Bandwidth Breakdown (Mbps)",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 10 },
              "unit": "bps"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "sum by (job, device) (rate(node_network_receive_bytes_total{job=~\"ingress-vps-.*\", device=~\"eth.*|ens.*|enp.*|wg0|wt0\"}[5m])) * 8",
              "legendFormat": "{{job}} - {{device}} (RX)"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "sum by (job, device) (rate(node_network_transmit_bytes_total{job=~\"ingress-vps-.*\", device=~\"eth.*|ens.*|enp.*|wg0|wt0\"}[5m])) * 8",
              "legendFormat": "{{job}} - {{device}} (TX)"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 16, "x": 0, "y": 21 },
          "id": 8,
          "title": "Outbound Traffic Attribution (Mbps) - what's actually using the WAN link",
          "description": "Splits physical-NIC egress into the two instrumented consumers (Traefik responses to public clients, and NetBird relay traffic relayed to other mesh peers) and whatever is left over. A large 'Unattributed' band that doesn't track request/relay activity usually means something outside these two services is using the VPS as its egress path (e.g. a NetBird peer left on full-tunnel exit-node routing through this VPS) - cross-check with `netbird status` / the NetBird management dashboard on the box.",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 25, "stacking": { "mode": "normal" } },
              "unit": "bps"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "sum by (job) (rate(traefik_entrypoint_responses_bytes_total{job=~\"ingress-vps-.*\", entrypoint=\"websecure\"}[5m])) * 8",
              "legendFormat": "{{job}} - Traefik HTTPS responses (public clients)"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "sum by (job) (rate(relay_transfer_sent_bytes_total{job=~\"ingress-vps-.*\"}[5m])) * 8",
              "legendFormat": "{{job}} - NetBird relay (sent to peers)"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "clamp_min(sum by (job) (rate(node_network_transmit_bytes_total{job=~\"ingress-vps-.*\", device=~\"eth.*|ens.*|enp.*\"}[5m])) * 8 - (sum by (job) (rate(traefik_entrypoint_responses_bytes_total{job=~\"ingress-vps-.*\", entrypoint=\"websecure\"}[5m])) * 8) - (sum by (job) (rate(relay_transfer_sent_bytes_total{job=~\"ingress-vps-.*\"}[5m])) * 8), 0)",
              "legendFormat": "{{job}} - Unattributed (not Traefik, not relay)"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 21 },
          "id": 9,
          "title": "NetBird Relay - Active/Idle Peers",
          "description": "How many mesh peers currently hold a relayed (non-P2P) session through this VPS. Correlate spikes here against the Unattributed band on the attribution panel.",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 10 },
              "unit": "short"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "relay_peers_active{job=~\"ingress-vps-.*\"}",
              "legendFormat": "{{job}} - active"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "relay_peers_idle{job=~\"ingress-vps-.*\"}",
              "legendFormat": "{{job}} - idle"
            }
          ]
        },
        {
          "gridPos": { "h": 5, "w": 24, "x": 0, "y": 29 },
          "id": 10,
          "title": "Current Failover Tier",
          "description": "Approximates the Cloudflare failover-monitor Worker's own decision (it probes vps-us/vps-eu directly over HTTPS from Cloudflare's edge) using this dashboard's own Traefik-up signal instead, since the Worker's live state isn't otherwise exported. The two should track each other in practice, but this is a proxy, not the literal DNS state - annotations above mark whenever the count of healthy edges changes.",
          "type": "stat",
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": { "text": "TIER 2 - Cloudflare Tunnel Fallback", "color": "red" },
                    "1": { "text": "TIER 1 - Degraded (1 edge down)", "color": "orange" },
                    "2": { "text": "TIER 1 - Both Edges Healthy", "color": "green" }
                  },
                  "type": "value"
                }
              ],
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 1 },
                  { "color": "green", "value": 2 }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "count(up{job=~\"ingress-vps-.*\", service=\"traefik\"} == 1)",
              "instant": true,
              "legendFormat": "Healthy edge VPS count"
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["ingress", "networking", "traefik", "vps"],
      "time": { "from": "now-6h", "to": "now" },
      "title": "Edge Ingress - VPS Fleet & Traefik Analytics"
    }
