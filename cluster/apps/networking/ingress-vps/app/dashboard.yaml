---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ingress-vps-traffic-analytics
  namespace: networking
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: networking
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
  json: |
    {
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus",
          "description": "",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "title": "Edge Node CPU Usage",
          "type": "gauge",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 85 }
                ]
              },
              "unit": "percent"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "100 - (avg by (job) (rate(node_cpu_seconds_total{job=~\"ingress-vps-.*\", mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "title": "Edge Node Memory Usage",
          "type": "gauge",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 75 },
                  { "color": "red", "value": 90 }
                ]
              },
              "unit": "percent"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "(1 - (node_memory_MemAvailable_bytes{job=~\"ingress-vps-.*\"} / node_memory_MemTotal_bytes{job=~\"ingress-vps-.*\"})) * 100",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "title": "Edge Root Disk Free",
          "type": "gauge",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 20 },
                  { "color": "green", "value": 35 }
                ]
              },
              "unit": "percent"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "(node_filesystem_avail_bytes{job=~\"ingress-vps-.*\", mountpoint=\"/\"} / node_filesystem_size_bytes{job=~\"ingress-vps-.*\", mountpoint=\"/\"}) * 100",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "title": "Edge Traefik Status",
          "type": "stat",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "options": { "0": { "color": "red", "text": "DOWN" }, "1": { "color": "green", "text": "HEALTHY" } }, "type": "value" }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "up{job=~\"ingress-vps-.*\", service=\"traefik\"}",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "id": 5,
          "title": "Edge Ingress Bandwidth (Mbps)",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 10 },
              "unit": "bps"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "sum by (job) (rate(node_network_receive_bytes_total{job=~\"ingress-vps-.*\", device!~\"lo|veth.*|docker.*\"}[5m])) * 8",
              "legendFormat": "{{job}} Inbound (RX)"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "sum by (job) (rate(node_network_transmit_bytes_total{job=~\"ingress-vps-.*\", device!~\"lo|veth.*|docker.*\"}[5m])) * 8",
              "legendFormat": "{{job}} Outbound (TX)"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "id": 6,
          "title": "Edge Traefik Request Rates (req/s)",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 15 },
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}" },
              "expr": "sum by (entrypoint) (rate(traefik_entrypoint_requests_total{job=~\"ingress-vps-.*\"}[5m]))",
              "legendFormat": "Entrypoint: {{entrypoint}}"
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["ingress", "networking", "traefik", "vps"],
      "time": { "from": "now-6h", "to": "now" },
      "title": "Edge Ingress - VPS Fleet & Traefik Analytics"
    }
