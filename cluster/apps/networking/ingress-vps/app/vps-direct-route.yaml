---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vps-direct-health
  namespace: networking
  annotations:
    external-dns.kubernetes.io/controller: "none"
spec:
  parentRefs:
    - name: external-gateway
      namespace: networking
  hostnames:
    - "vps-us.${SECRET_DOMAIN}"
    - "vps-eu.${SECRET_DOMAIN}"
    - "proxy.${SECRET_DOMAIN}"
    - "ingress.${SECRET_DOMAIN}"
    - "fast.${SECRET_DOMAIN}"
    - "external.${SECRET_DOMAIN}"
  rules:
    - backendRefs:
        - name: vps-health-responder
          port: 8080
