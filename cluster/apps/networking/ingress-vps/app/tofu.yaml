---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: ingress-vps-eu
  namespace: networking
spec:
  # EU applies first: it's the less-used region, so a bad Terraform/cloud-init change
  # hits it before it ever reaches US.
  interval: 15m
  retryInterval: 1m
  approvePlan: auto
  destroyResourcesOnDeletion: true
  path: ./cluster/apps/networking/ingress-vps/eu
  serviceAccountName: tf-runner
  sourceRef:
    kind: GitRepository
    name: tofu-infra-git
    namespace: networking
  vars:
    - name: secret_domain
      value: "${SECRET_DOMAIN}"
  varsFrom:
    - kind: Secret
      name: cloudflare-ddns
    - kind: Secret
      name: ingress-tunnel-secrets
  writeOutputsToSecret:
    name: vps-eu-output
  # Self-heal a stale state lock left behind by a killed/evicted tf-runner pod (single
  # controller, GitOps-only workflow here - no other process ever applies this state, so
  # there's nothing "auto" could actually collide with). Without this, an orphaned lock
  # blocks every future reconcile forever with no recovery but a manual force-unlock.
  tfstate:
    forceUnlock: auto
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: ingress-vps-us
  namespace: networking
spec:
  dependsOn:
    - name: ingress-vps-eu
      namespace: networking
  interval: 15m
  retryInterval: 1m
  approvePlan: auto
  destroyResourcesOnDeletion: true
  path: ./cluster/apps/networking/ingress-vps/us
  serviceAccountName: tf-runner
  sourceRef:
    kind: GitRepository
    name: tofu-infra-git
    namespace: networking
  vars:
    - name: secret_domain
      value: "${SECRET_DOMAIN}"
  varsFrom:
    - kind: Secret
      name: cloudflare-ddns
    - kind: Secret
      name: ingress-tunnel-secrets
  writeOutputsToSecret:
    name: vps-us-output
  tfstate:
    forceUnlock: auto
