---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vps-health-responder
  namespace: networking
  labels:
    app.kubernetes.io/name: vps-health-responder
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vps-health-responder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vps-health-responder
    spec:
      containers:
        - name: responder
          image: docker.io/library/caddy:2.11.4-alpine
          command:
            - caddy
            - respond
            - --listen
            - :8080
            - --status
            - "418"
            - "I'm an espresso machine\n"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: XDG_DATA_HOME
              value: /tmp/data
            - name: XDG_CONFIG_HOME
              value: /tmp/config
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vps-health-responder
  namespace: networking
  labels:
    app.kubernetes.io/name: vps-health-responder
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: vps-health-responder
