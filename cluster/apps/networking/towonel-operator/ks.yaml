apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: towonel-operator
  namespace: flux-system
spec:
  targetNamespace: networking
  path: ./cluster/apps/networking/towonel-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 1h
  retryInterval: 1m
  timeout: 5m
