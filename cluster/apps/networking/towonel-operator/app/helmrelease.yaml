apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: towonel-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
    controllers:
      towonel-operator:
        strategy: RollingUpdate
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: depName=ghcr.io/jacaudi/towonel-operator datasource=docker
              repository: ghcr.io/jacaudi/towonel-operator
              tag: latest@sha256:be7821599b3c739da4dcea8b5e00006ed1f84b77c0eaed7f335d58e562bf315b
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            env:
              TOWONEL_HUB_OPERATOR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: towonel-hub-secrets
                    key: TOWONEL_HUB_OPERATOR_API_KEY
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    serviceAccount:
      towonel-operator: {}
