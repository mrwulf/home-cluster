---
apiVersion: towonel.io/v1alpha1
kind: TowonelTunnel
metadata:
  name: towonel-tunnel
  namespace: networking
spec:
  region: EU
  apiKeySecretRef:
    name: towonel-hub-secrets
    key: TOWONEL_K8S_OPERATOR_API_KEY
  tokenExpiry: 0
  deletionPolicy: Retain
---
apiVersion: towonel.io/v1alpha1
kind: TowonelAgent
metadata:
  name: towonel-agent
  namespace: networking
spec:
  tunnelRef:
    name: towonel-tunnel
  services:
    - hostname: "plex.${SECRET_DOMAIN}"
      origin: "traefik-external.networking.svc.cluster.local:443"
      edgeTLSMode: passthrough
    - hostname: "photos.${SECRET_DOMAIN}"
      origin: "traefik-external.networking.svc.cluster.local:443"
      edgeTLSMode: passthrough
