---
# The dynamic DNS CronJob this directory used to deploy was replaced by a ddup domain
# (cluster/apps/networking/ddup). What's left is the Cloudflare token the OpenTofu stacks in
# ingress-vps use (`varsFrom` in ingress-vps/app/tofu.yaml reads CLOUDFLARE_APIKEY from this
# secret), so the name is historical. TODO: rename it and move it next to those stacks.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-ddns
  namespace: networking
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: cloudflare-ddns
    template:
      data:
        CLOUDFLARE_APIKEY: |-
          {{ .cloudflare_token }}
  refreshInterval: 15m
  data:
    - secretKey: cloudflare_token
      remoteRef:
        key: "Cloudflare Credentials"
        property: api-token-external-dns
