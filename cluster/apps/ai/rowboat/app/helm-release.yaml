---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app rowboat
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      rowboat:
        # Harbor's in-process hub is single-instance: never scale past 1.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.7
            envFrom:
              - secretRef:
                  name: rowboat
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        containers:
          app:
            image:
              # Built by .github/workflows/rowboat-harbor-image.yaml: upstream
              # publishes no Harbor image.
              repository: ghcr.io/mrwulf/rowboat-harbor
              tag: v1.0.9
            env:
              PORT: "4272"
              HARBOR_NAME: Home Spaces
              HARBOR_ADDRESS: "rowboat.home.${SECRET_DOMAIN}"
              # Pocket ID is only the token issuer. It has no DCR, so the stock
              # desktop client cannot complete sign-in yet (see TODO.md).
              AUTH_ISSUER: "https://id.${SECRET_DOMAIN}"
              BLOBS_S3_BUCKET: rowboat
              BLOBS_S3_ENDPOINT: "http://minio.databases.svc.cluster.local:9000"
              BLOBS_S3_REGION: us-east-1
              BLOBS_S3_FORCE_PATH_STYLE: "true"
              # The self-hosted web app below: CORS origin, and the app a
              # Spaces link opened in a browser offers.
              HARBOR_WEB_ORIGINS: "https://spaces.home.${SECRET_DOMAIN}"
              HARBOR_WEB_APP_URL: "https://spaces.home.${SECRET_DOMAIN}"
            envFrom:
              - secretRef:
                  name: rowboat
              - secretRef:
                  name: rowboat-minio-credentials
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 4272
                  periodSeconds: 10
                  failureThreshold: 6
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 768Mi
      web:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # Built by .github/workflows/rowboat-harbor-image.yaml from
              # .github/rowboat-web (patched for a static OIDC client ID).
              repository: ghcr.io/mrwulf/rowboat-web
              tag: v1.0.9
            env:
              # Rendered into nginx's CSP and /config.js at start, so the
              # domain stays out of the public image.
              SERVER_URL: "https://rowboat.home.${SECRET_DOMAIN}"
              SERVER_WS_URL: "wss://rowboat.home.${SECRET_DOMAIN}"
              ISSUER_URL: "https://id.${SECRET_DOMAIN}"
              OIDC_CLIENT_ID: rowboat-web
            securityContext:
              runAsNonRoot: true
              runAsUser: 101
              runAsGroup: 101
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            probes:
              liveness: &webprobe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
              readiness: *webprobe
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      app:
        controller: rowboat
        ports:
          http:
            port: 4272
      web:
        controller: web
        ports:
          http:
            port: 8080
    route:
      app:
        enabled: true
        annotations:
          gatus.io/enabled: "true"
        parentRefs:
          - name: internal-gateway
            namespace: networking
        hostnames:
          - "rowboat.home.${SECRET_DOMAIN}"
        rules:
          # No Pocket ID forward-auth: the client needs unauthenticated
          # /.well-known discovery and Harbor verifies bearer tokens itself.
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: rfc1918-ips
            backendRefs:
              - identifier: app
                port: http
      web:
        enabled: true
        annotations:
          gatus.io/enabled: "true"
        parentRefs:
          - name: internal-gateway
            namespace: networking
        hostnames:
          - "spaces.home.${SECRET_DOMAIN}"
        rules:
          # Forward-auth would break the app's own OIDC redirect; the app signs
          # in with Pocket ID itself.
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: rfc1918-ips
            backendRefs:
              - identifier: web
                port: http
