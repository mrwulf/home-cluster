---
# yaml-language-server: $schema=https://kochhaus-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app lifeos-agent
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: *app
    template:
      data:
        ROWBOAT_AGENT_KEY: "{{ .rowboat_agent_key }}"
        # From `claude setup-token`; valid for one year.
        CLAUDE_CODE_OAUTH_TOKEN: "{{ .claude_oauth_token }}"
        FORGEJO_USER: "{{ .forgejo_user }}"
        FORGEJO_TOKEN: "{{ .forgejo_token }}"
        # owner/name of the memory vault repository.
        VAULT_REPO: "{{ .vault_repo }}"
  data:
    - secretKey: rowboat_agent_key
      remoteRef:
        key: &item "LifeOS Agent Credentials"
        property: "rowboat-agent-key"
    - secretKey: claude_oauth_token
      remoteRef:
        key: *item
        property: "claude-oauth-token"
    - secretKey: forgejo_user
      remoteRef:
        key: *item
        property: "forgejo-user"
    - secretKey: forgejo_token
      remoteRef:
        key: *item
        property: "forgejo-token"
    - secretKey: vault_repo
      remoteRef:
        key: *item
        property: "vault-repo"
