---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: mcp-pullmd
spec:
  groupRef:
    name: toolhive-servers
  # renovate: depName=aeternalabshq/pullmd datasource=docker
  image: docker.io/aeternalabshq/pullmd:3.11.0@sha256:ff6aa4bf94ef5d9235d18e565629f9a9d6ae2c4e406a1e6501670db9038a64e8
  # pullmd speaks MCP natively over Streamable-HTTP - no stdio proxy needed
  transport: streamable-http
  mcpPort: 3000
  proxyPort: 8080
  env:
    - name: PORT
      value: "3000"
    - name: CACHE_DB
      value: /data/cache.db
    # No OIDC client here: pullmd has no native SSO support, and this server
    # is only reachable through the toolhive vMCP gateway, which is already
    # LAN-restricted (rfc1918-ips) - see cluster/apps/ai/toolhive/operator/httproute.yaml
    - name: PULLMD_AUTH_MODE
      value: disabled
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    # CPU limits omitted per cluster rule #6
    limits:
      memory: 512Mi
  podTemplateSpec:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      containers:
        - name: mcp
          # pullmd's entrypoint runs as root, chowns /data, then drops to its
          # own unprivileged "app" user via su-exec. The operator's default
          # securityContext runs the container directly as a fixed non-root
          # UID/GID that doesn't match pullmd's own user, so su-exec's
          # setuid/setgid fails outright (verified: CrashLoopBackOff,
          # "su-exec: setgroups(101): Operation not permitted"). Overriding
          # here restores the image's own root-then-drop model instead of
          # fighting it, while keeping capabilities minimal (rule 9).
          # NOTE: this podTemplateSpec container entry replaces the whole
          # container spec rather than field-merging onto it - `resources`
          # must be repeated here too, or the operator silently drops it
          # (verified empirically: omitting it produced `resources: {}`).
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["SETUID", "SETGID", "CHOWN"]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      # emptyDir, not a PVC: the cache is fully disposable and rebuilds from
      # re-fetched URLs, and a cold cache on restart doesn't hurt startup
      # time - a PVC would only trade that for real Ceph capacity/latency.
      volumes:
        - name: data
          emptyDir: {}
