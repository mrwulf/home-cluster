---
# Single PVC for pullmd's SQLite fetch cache. Not VolSync-backed: the cache
# is fully disposable and rebuilds itself from re-fetched URLs, so replicated
# backup would be wasted resource churn (rule 8 deviation, documented).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pullmd-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 2Gi
