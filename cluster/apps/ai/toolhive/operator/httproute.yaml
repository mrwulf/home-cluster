---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: toolhive
  annotations:
    gatus.io/enabled: "true"
    gatus.io/endpoint: |
      url: "https://toolhive.home.${SECRET_DOMAIN}/mcp"
      method: POST
      headers:
        Content-Type: application/json
        Accept: application/json, text/event-stream
      # Use ping, not initialize: initialize creates a vMCP session (~60Mi each, never reaped) and OOMs the gateway
      body: '{"jsonrpc":"2.0","id":1,"method":"ping"}'
      conditions:
        - "[STATUS] == 200"
        - "[BODY].jsonrpc == 2.0"
spec:
  parentRefs:
    - name: internal-gateway
      namespace: networking
  hostnames:
    - "toolhive.home.${SECRET_DOMAIN}"
  rules:
    # Machine-client streamable HTTP endpoint (vMCP does not serve legacy SSE) - no OIDC, LAN-only
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
        - path:
            type: PathPrefix
            value: /mcp/
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: rfc1918-ips
      backendRefs:
        - name: vmcp-toolhive-gateway
          port: 4483
    # Browser UI & all other paths - OIDC protected
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: rfc1918-ips
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: traefik-middleware-chain-pocket-id
      backendRefs:
        - name: vmcp-toolhive-gateway
          port: 4483
