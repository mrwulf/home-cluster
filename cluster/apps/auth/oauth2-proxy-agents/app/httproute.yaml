---
# Sign-in and callback host for the agents session. LAN-only: the browser only
# needs to reach it from the same network as agents.home.${SECRET_DOMAIN}.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth2-proxy-agents
spec:
  parentRefs:
    - name: internal-gateway
      namespace: networking
  hostnames:
    - "oauth-agents.home.${SECRET_DOMAIN}"
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: rfc1918-ips
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: traefik-middleware-chain-internal-no-auth
      backendRefs:
        - name: oauth2-proxy-agents
          port: 4180
