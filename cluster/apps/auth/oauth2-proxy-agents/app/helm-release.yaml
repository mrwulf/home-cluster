# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app oauth2-proxy-agents
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      oauth2-proxy-agents:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: quay.io/oauth2-proxy/oauth2-proxy
              tag: v7.15.5
            args:
              - --alpha-config=/etc/oauth2-proxy/config/alpha-config.yaml
            env:
              # Intentionally a second instance rather than settings on the
              # shared one: that session must stay under Pocket ID's fixed 1h
              # id_token (Ceph dashboard), this one renews through the refresh
              # token instead. Different cookie name so the two never collide
              # on the shared parent domain.
              - name: OAUTH2_PROXY_REDIRECT_URL
                value: https://oauth-agents.home.${SECRET_DOMAIN}/oauth2/callback
              - name: OAUTH2_PROXY_COOKIE_NAME
                value: _oauth2_proxy_agents
              - name: OAUTH2_PROXY_COOKIE_DOMAINS
                value: ".home.${SECRET_DOMAIN}"
              - name: OAUTH2_PROXY_WHITELIST_DOMAINS
                value: ".home.${SECRET_DOMAIN}"
              - name: OAUTH2_PROXY_COOKIE_SECURE
                value: "true"
              # Total session length; keep <= refreshTokenDurationMinutes in oidc-client.yaml.
              - name: OAUTH2_PROXY_COOKIE_EXPIRE
                value: "720h"
              # Renew with the refresh token before the 1h id_token lapses.
              - name: OAUTH2_PROXY_COOKIE_REFRESH
                value: "45m"
              - name: OAUTH2_PROXY_EMAIL_DOMAINS
                value: "*"
              - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
                value: "true"
              - name: OAUTH2_PROXY_REVERSE_PROXY
                value: "true"
            envFrom:
              - secretRef:
                  name: oauth2-proxy-agents-secret
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi

    persistence:
      alpha-config:
        type: configMap
        name: oauth2-proxy-agents-alpha-config
        globalMounts:
          - path: /etc/oauth2-proxy/config/alpha-config.yaml
            subPath: alpha-config.yaml
            readOnly: true
      oidc-client-secret:
        type: secret
        name: oauth2-proxy-agents-oidc-credentials
        globalMounts:
          - path: /etc/oauth2-proxy/secrets/client-secret
            subPath: OAUTH2_PROXY_CLIENT_SECRET
            readOnly: true

    service:
      app:
        controller: oauth2-proxy-agents
        ports:
          http:
            port: 4180
