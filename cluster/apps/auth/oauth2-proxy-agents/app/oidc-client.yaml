---
# Dedicated client for the long-lived agents session. The shared oauth2-proxy
# keeps its 50m cookie because it relays the id_token to the Ceph dashboard
# (see rook-ceph/rook-ceph/README.md); this instance relays nothing, so it can
# renew the session with the refresh token instead and stay signed in for days.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: oauth2-proxy-agents
spec:
  name: OAuth2 Proxy (agents)
  clientID: 77c7ae43-41b8-4cbb-b6e2-2d8d8caf9ff0
  accessTokenDurationMinutes: 60
  # Matches OAUTH2_PROXY_COOKIE_EXPIRE in helm-release.yaml (30d).
  refreshTokenDurationMinutes: 43200
  callbackUrls:
    - https://oauth-agents.home.${SECRET_DOMAIN}/oauth2/callback
  logoutCallbackUrls:
    - https://oauth-agents.home.${SECRET_DOMAIN}/oauth2/sign_out
    - https://oauth-agents.home.${SECRET_DOMAIN}/
  allowedUserGroups:
    - name: users
      namespace: auth
  pkceEnabled: true
  secret:
    name: oauth2-proxy-agents-oidc-credentials
    keys:
      clientID: OAUTH2_PROXY_CLIENT_ID
      clientSecret: OAUTH2_PROXY_CLIENT_SECRET
      issuerUrl: OAUTH2_PROXY_OIDC_ISSUER_URL
