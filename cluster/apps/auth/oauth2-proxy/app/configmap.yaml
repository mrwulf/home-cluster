---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-alpha-config
data:
  # clientID/issuerURL are duplicated from oidc-client.yaml (spec.clientID) because
  # oauth2-proxy's alpha config only supports a file source for clientSecret, not
  # clientID - keep them in sync if the OIDC client is ever recreated.
  alpha-config.yaml: |
    server:
      bindAddress: "0.0.0.0:4180"
    providers:
      - id: pocket-id
        provider: oidc
        clientID: c6c0b4d2-7e1a-4c9f-8d2b-6f8a3c9e1b7d
        clientSecretFile: /etc/oauth2-proxy/secrets/client-secret
        scope: "openid email profile groups"
        code_challenge_method: S256
        oidcConfig:
          issuerURL: https://id.${SECRET_DOMAIN}
          emailClaim: email
          groupsClaim: groups
    upstreamConfig:
      upstreams:
        - id: static-response
          path: /
          static: true
          staticCode: 202
    injectResponseHeaders:
      - name: X-Auth-Request-User
        values:
          - claimSource:
              claim: user
      - name: X-Auth-Request-Email
        values:
          - claimSource:
              claim: email
      - name: X-Auth-Request-Preferred-Username
        values:
          - claimSource:
              claim: preferred_username
      - name: X-Auth-Request-Groups
        values:
          - claimSource:
              claim: groups
      - name: Authorization
        values:
          - claimSource:
              claim: id_token
              prefix: "Bearer "
      # Consumed by Ceph dashboard's native oauth2 SSO (ceph dashboard sso enable
      # oauth2) - see cluster/apps/rook-ceph/rook-ceph/cluster/middlewares.yaml.
      - name: X-Access-Token
        values:
          - claimSource:
              claim: id_token
