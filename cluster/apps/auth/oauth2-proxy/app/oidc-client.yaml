---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: oauth2-proxy
spec:
  name: OAuth2 Proxy
  clientID: c6c0b4d2-7e1a-4c9f-8d2b-6f8a3c9e1b7d
  # Pocket ID's id_token lifetime is fixed at 1h and has no setting (the
  # per-client durations only cover access/refresh tokens). oauth2-proxy
  # relays the id_token it holds to Ceph's dashboard, which enforces its exp
  # client-side and never gets a fresh one on refresh, so the proxy session
  # must end before the id_token does or the dashboard loops on an expired
  # token. Ordered Ceph 45m < proxy cookie/this 50m < id_token 60m - see
  # rook-ceph/rook-ceph/README.md. Re-login is silent via Pocket ID's session.
  accessTokenDurationMinutes: 50
  callbackUrls:
    - https://oauth.${SECRET_DOMAIN}/oauth2/callback
  logoutCallbackUrls:
    - https://oauth.${SECRET_DOMAIN}/oauth2/sign_out
    - https://oauth.${SECRET_DOMAIN}/
  allowedUserGroups:
    - name: users
      namespace: auth
  pkceEnabled: true
  secret:
    name: oauth2-proxy-oidc-credentials
    keys:
      clientID: OAUTH2_PROXY_CLIENT_ID
      clientSecret: OAUTH2_PROXY_CLIENT_SECRET
      issuerUrl: OAUTH2_PROXY_OIDC_ISSUER_URL
