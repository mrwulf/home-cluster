---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: oauth2-proxy
spec:
  name: OAuth2 Proxy
  clientID: c6c0b4d2-7e1a-4c9f-8d2b-6f8a3c9e1b7d
  # Matches oauth2-proxy's own default --cookie-expire (168h). oauth2-proxy
  # never gets a fresh id_token on refresh (OAuth2 spec-compliant but
  # oauth2-proxy-known limitation: refresh_token grant only returns a new
  # access_token) - Pocket ID's 1h default access/ID token lifetime meant
  # the id_token relayed to apps like Ceph's dashboard (which client-side
  # enforces the token's own exp) went stale long before the oauth2-proxy
  # session itself expired, causing an auto-logout -> re-login -> same
  # stale token -> auto-logout redirect loop.
  accessTokenDurationMinutes: 10080
  callbackUrls:
    - https://oauth.${SECRET_DOMAIN}/oauth2/callback
  logoutCallbackUrls:
    - https://oauth.${SECRET_DOMAIN}/oauth2/sign_out
    - https://oauth.${SECRET_DOMAIN}/
  allowedUserGroups:
    - name: users
      namespace: auth
  pkceEnabled: true
  secret:
    name: oauth2-proxy-oidc-credentials
    keys:
      clientID: OAUTH2_PROXY_CLIENT_ID
      clientSecret: OAUTH2_PROXY_CLIENT_SECRET
      issuerUrl: OAUTH2_PROXY_OIDC_ISSUER_URL
