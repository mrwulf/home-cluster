---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: oauth2-proxy
spec:
  name: OAuth2 Proxy
  clientID: c6c0b4d2-7e1a-4c9f-8d2b-6f8a3c9e1b7d
  # Kept equal to oauth2-proxy's --cookie-expire and Ceph's dashboard
  # jwt-token-ttl (all 8h, see rook-ceph/rook-ceph/README.md) so the three
  # layers expire together. oauth2-proxy never gets a fresh id_token on
  # refresh (refresh_token grant only returns a new access_token), and Ceph's
  # dashboard enforces the id_token's own exp client-side, so a token
  # outliving or undercutting the others leaves a stale session -> auto-logout
  # -> re-login -> same stale token redirect loop. Shorter is fine: Pocket ID's
  # own session makes the re-login silent.
  accessTokenDurationMinutes: 480
  callbackUrls:
    - https://oauth.${SECRET_DOMAIN}/oauth2/callback
  logoutCallbackUrls:
    - https://oauth.${SECRET_DOMAIN}/oauth2/sign_out
    - https://oauth.${SECRET_DOMAIN}/
  allowedUserGroups:
    - name: users
      namespace: auth
  pkceEnabled: true
  secret:
    name: oauth2-proxy-oidc-credentials
    keys:
      clientID: OAUTH2_PROXY_CLIENT_ID
      clientSecret: OAUTH2_PROXY_CLIENT_SECRET
      issuerUrl: OAUTH2_PROXY_OIDC_ISSUER_URL
