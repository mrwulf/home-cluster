# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: code-server
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        type: statefulset

        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          main:
            lifecycle:
              postStart:
                exec:
                  command:
                    [
                      "/bin/bash",
                      "-c",
                      "sudo /tmp/setup-tools.sh > /home/coder/setup.log 2>&1",
                    ]
            image: &image
              repository: ghcr.io/coder/code-server
              tag: 4.144.0

            args:
              - --auth
              - none
              - --user-data-dir
              - /home/coder/.vscode
              - --extensions-dir
              - /home/coder/.vscode
              - --port
              - "8080"
              - --enable-proposed-api
              - google.antigravity
              - --enable-proposed-api
              - google.antigravity-code-executor
              - --proxy-domain
              - &host "code.home.${SECRET_DOMAIN}"
              - /home/coder

            env:
              DISABLE_TELEMETRY: "true"

            resources:
              requests:
                cpu: 10m
                memory: 640M
              limits:
                memory: 8G

          # Agent terminals (Codeman). Same image so it sees the same PVC and the
          # same uid; its own container so it gets its own memory limit and a
          # supervised entrypoint instead of a background process in postStart.
          codeman:
            image: *image
            command: ["/bin/bash", "/tmp/start-codeman.sh"]
            env:
              DISABLE_TELEMETRY: "true"
              CODEMAN_ALLOWED_HOSTS: &agentsHost "agents.home.${SECRET_DOMAIN}"
            resources:
              requests:
                cpu: 10m
                memory: 256M
              limits:
                memory: 6G

        pod:
          # The agents use kubeconfig/talosconfig from the PVC, not the pod's identity.
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

    service:
      main:
        controller: main
        ports:
          http:
            port: &httpPort 8080
      agents:
        controller: main
        ports:
          http:
            port: &agentsPort 3000

    route:
      main:
        enabled: true
        annotations:
          gatus.io/enabled: "true"
        parentRefs:
          - name: internal-gateway
            namespace: networking
        hostnames:
          - *host
        rules:
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: rfc1918-ips
            backendRefs:
              - identifier: main
                port: *httpPort
      agents:
        enabled: true
        annotations:
          gatus.io/enabled: "true"
        parentRefs:
          - name: internal-gateway
            namespace: networking
        hostnames:
          - *agentsHost
        rules:
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: rfc1918-ips
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: agents-chain-pocket-id
            backendRefs:
              - identifier: agents
                port: *agentsPort

    persistence:
      setup-tools:
        type: configMap
        name: code-server-setup-tools
        defaultMode: 0755
        globalMounts:
          - path: /tmp/setup-tools.sh
            subPath: setup-tools.sh
            readOnly: true
          - path: /tmp/start-codeman.sh
            subPath: start-codeman.sh
            readOnly: true
      config:
        existingClaim: "${VOLSYNC_CLAIM}"
        globalMounts:
          - path: /home/coder
