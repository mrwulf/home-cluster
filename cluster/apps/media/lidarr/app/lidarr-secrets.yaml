---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lidarr-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: lidarr-secret
    template:
      data:
        LIDARR__API_KEY: "{{ .API_KEY }}"
        LIDARR__POSTGRES_HOST: &dbHost postgres17-rw.databases.svc.cluster.local
        LIDARR__POSTGRES_PORT: "5432"
        LIDARR__POSTGRES_USER: &dbUser "{{ .POSTGRES_USER }}"
        LIDARR__POSTGRES_PASSWORD: &dbPass "{{ .POSTGRES_PASSWORD }}"
        LIDARR__POSTGRES_MAIN_DB: lidarr_main
        LIDARR__POSTGRES_LOG_DB: lidarr_log
        INIT_POSTGRES_DBNAME: lidarr_main lidarr_log
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  data:
    - secretKey: POSTGRES_SUPER_USER
      remoteRef:
        key: "Postgres SuperUser Credentials"
        property: "username"
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
    - secretKey: POSTGRES_SUPER_PASS
      remoteRef:
        key: "Postgres SuperUser Credentials"
        property: "password"
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
    - secretKey: POSTGRES_USER
      remoteRef:
        key: "Lidarr Credentials"
        property: "POSTGRES_USER"
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: "Lidarr Credentials"
        property: "POSTGRES_PASSWORD"
    - secretKey: API_KEY
      remoteRef:
        key: "Lidarr Credentials"
        property: "API_KEY"
