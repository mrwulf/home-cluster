---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: scrob
spec:
  name: Scrob
  pkceEnabled: true
  launchUrl: https://scrob.home.${SECRET_DOMAIN}/
  callbackUrls:
    - https://scrob.home.${SECRET_DOMAIN}/oidc-callback
  allowedUserGroups:
    - name: users
      namespace: auth
  secret:
    name: scrob-oidc-credentials
    keys:
      clientID: OIDC_CLIENT_ID
      clientSecret: OIDC_CLIENT_SECRET
      authorizationUrl: OIDC_AUTH_URL
      tokenUrl: OIDC_TOKEN_URL
      userinfoUrl: OIDC_USERINFO_URL
      endSessionUrl: OIDC_LOGOUT_URL
