# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tdarr-config
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      sync:
        type: cronjob
        cronjob:
          # Idempotent: applies flows/libraries/worker limits, refreshes the favourites and
          # foreign-original lists, and (only when feed.json enables it) feeds the queue.
          schedule: "*/5 * * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 3
          ttlSecondsAfterFinished: 3600
          backoffLimit: 0
        containers:
          main:
            image:
              # Same image as tdarr-server: it already ships node, which is all the script needs.
              repository: ghcr.io/haveagitgat/tdarr
              tag: 2.94.02
            command:
              - node
              - /config/sync.js
            env:
              TDARR_URL: http://tdarr-server.media.svc.cluster.local:8265
              SONARR_URL: http://sonarr.media.svc.cluster.local:8989
              RADARR_URL: http://radarr.media.svc.cluster.local:7878
              # Same Flux substitution the arrs use for their own key; never committed.
              SONARR_APIKEY: "${SONARR_APIKEY}"
              RADARR_APIKEY: "${RADARR_APIKEY}"
              CONFIG_DIR: /config
              STATE_DIR: /temp/hc
              # Work folders left by killed/failed jobs are removed after this many idle hours
              CACHE_DIR: /temp
              WORKDIR_STALE_HOURS: "6"
              QUEUE_BUDGET: "400"
              # Movie folders hold one file each, so this caps files added per run (~1.5 s per scan)
              MAX_SCANS_PER_RUN: "150"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    persistence:
      config:
        type: configMap
        name: tdarr-config
        globalMounts:
          - path: /config
            readOnly: true
      # Shared with the Tdarr nodes: the lists and feeder state written here are read by the flows.
      shared-cache:
        existingClaim: tdarr-shared-cache
        globalMounts:
          - path: /temp
