---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazarr-secrets
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: bazarr-secrets
    template:
      data:
        BAZARR__API_KEY: "{{ .API_KEY }}"
        POSTGRES_ENABLED: "true"
        POSTGRES_HOST: &dbHost postgres17-rw.databases.svc.cluster.local
        POSTGRES_PORT: "5432"
        POSTGRES_USERNAME: &dbUser "{{ .POSTGRES_USER }}"
        POSTGRES_PASSWORD: &dbPass "{{ .POSTGRES_PASSWORD }}"
        POSTGRES_DATABASE: &dbname bazarr
        INIT_POSTGRES_DBNAME: *dbname
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  data:
    - secretKey: POSTGRES_SUPER_USER
      remoteRef:
        key: "Postgres SuperUser Credentials"
        property: "username"
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
    - secretKey: POSTGRES_SUPER_PASS
      remoteRef:
        key: "Postgres SuperUser Credentials"
        property: "password"
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
    - secretKey: POSTGRES_USER
      remoteRef:
        key: "Bazarr Admin Credentials"
        property: "POSTGRES_USER"
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: "Bazarr Admin Credentials"
        property: "POSTGRES_PASSWORD"
    - secretKey: API_KEY
      remoteRef:
        key: "Bazarr Admin Credentials"
        property: "API_KEY"
