apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-gpu
spec:
  interval: 1h
  chart:
    spec:
      chart: intel-device-plugins-gpu
      version: 0.37.1
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: intel-charts
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    name: intel-gpu-plugin
    # How many pods may claim each node's iGPU at once. This is a scheduling quota, not hardware
    # capacity: all claimants time-share the same GPU. 6 leaves room for one Tdarr node per
    # node alongside Plex, Jellyfin, immich, ollama and stash.
    sharedDevNum: 6
    nodeFeatureRule: false
