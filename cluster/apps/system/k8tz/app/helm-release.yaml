# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app k8tz
spec:
  chart:
    spec:
      chart: k8tz
      version: 0.22.0
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: k8tz
  interval: 1h
  values:
    namespace: system
    createNamespace: false

    replicaCount: 2

    timezone: ${TIMEZONE}

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    cronJobTimeZone: true

    initContainerResources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

    webhook:
      certManager:
        enabled: true
        issuerRef:
          name: k8tz-webhook-selfsign
          kind: Issuer

    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app
              topologyKey: kubernetes.io/hostname
  # The chart has no value for the cert-watcher sidecar's resources.
  postRenderers:
    - kustomize:
        patches:
          - patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: k8tz
              spec:
                template:
                  spec:
                    containers:
                      - name: k8tz-cert-watcher
                        resources:
                          requests:
                            cpu: 10m
                            memory: 64Mi
                          limits:
                            memory: 128Mi
