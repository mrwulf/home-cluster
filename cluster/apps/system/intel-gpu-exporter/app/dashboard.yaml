---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: intel-gpu
  namespace: system
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: system
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
  json: |
    {
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus",
          "description": "",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "gauge",
          "title": "Busiest GPU engine (now)",
          "description": "Highest busy % across the GPU's engines (render, video, video enhance, blitter). 100% means that engine is saturated.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
              },
              "expr": "max by (node) (gpumon_engine_usage{attrib=\"busy\", node=~\"$node\"})",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 50
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          }
        },
        {
          "id": 2,
          "type": "gauge",
          "title": "Share slots handed out",
          "description": "Scheduling view of 'full': pods requesting gpu.intel.com/i915 vs the node's sharedDevNum. All pods on a node time-share one GPU, so a full node cannot take another GPU pod even if the engines are idle.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
          },
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
              },
              "expr": "sum by (node) (kube_pod_container_resource_requests{resource=\"gpu_intel_com_i915\", node=~\"$node\"}) / max by (node) (kube_node_status_allocatable{resource=\"gpu_intel_com_i915\", node=~\"$node\"})",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 0.99
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Free share slots",
          "description": "Slots still available for new GPU pods on each node. Zero means the next GPU pod stays Pending.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
          },
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
              },
              "expr": "max by (node) (kube_node_status_allocatable{resource=\"gpu_intel_com_i915\", node=~\"$node\"}) - sum by (node) (kube_pod_container_resource_requests{resource=\"gpu_intel_com_i915\", node=~\"$node\"})",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Engine busy % (every engine)",
          "description": "Per-engine busy %, sampled every 5s and aggregated per scrape.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
              },
              "expr": "gpumon_engine_usage{attrib=\"busy\", node=~\"$node\"}",
              "legendFormat": "{{node}} {{engine}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Video engines busy % (QSV encode/decode)",
          "description": "The fixed-function media engines that Plex, Jellyfin and Tdarr use for hardware transcoding. VideoEnhance is scaling/tone mapping.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
          },
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
              },
              "expr": "gpumon_engine_usage{attrib=\"busy\", engine=~\"(?i)video.*\", node=~\"$node\"}",
              "legendFormat": "{{node}} {{engine}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Share slots in use vs available",
          "description": "Solid: slots handed out. Dashed: node capacity (sharedDevNum).",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
              },
              "expr": "sum by (node) (kube_pod_container_resource_requests{resource=\"gpu_intel_com_i915\", node=~\"$node\", node!=\"\"})",
              "legendFormat": "{{node}} in use",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
              },
              "expr": "max by (node) (kube_node_status_allocatable{resource=\"gpu_intel_com_i915\", node=~\"$node\"})",
              "legendFormat": "{{node}} available",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "min": 0,
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*available"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 7,
          "type": "table",
          "title": "Who holds the slots",
          "description": "Pods currently requesting a GPU share (kube-state-metrics).",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
          },
          "gridPos": {
            "x": 12,
            "y": 14,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
              },
              "expr": "kube_pod_container_resource_requests{resource=\"gpu_intel_com_i915\", node=~\"$node\"}",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "node",
                "desc": false
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "container": true,
                  "resource": true,
                  "job": true,
                  "instance": true,
                  "endpoint": true,
                  "service": true,
                  "uid": true,
                  "unit": true,
                  "pod_ip": true,
                  "host_ip": true,
                  "prometheus": true
                },
                "renameByName": {
                  "Value": "slots",
                  "node": "node",
                  "namespace": "namespace",
                  "pod": "pod"
                },
                "indexByName": {
                  "node": 0,
                  "namespace": 1,
                  "pod": 2,
                  "Value": 3
                }
              }
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "GPU frequency",
          "description": "Requested vs actual GPU clock.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
          },
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
              },
              "expr": "gpumon_frequency{node=~\"$node\"}",
              "legendFormat": "{{node}} {{type}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "rotmhz",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "GPU power",
          "description": "Package and GPU power from intel_gpu_top.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
          },
          "gridPos": {
            "x": 8,
            "y": 22,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
              },
              "expr": "gpumon_power{node=~\"$node\"}",
              "legendFormat": "{{node}} {{type}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "watt",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Memory controller bandwidth",
          "description": "Integrated memory controller read/write, MiB/s.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
          },
          "gridPos": {
            "x": 16,
            "y": 22,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
              },
              "expr": "gpumon_imc_read{node=~\"$node\"}",
              "legendFormat": "{{node}} read",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
              },
              "expr": "gpumon_imc_write{node=~\"$node\"}",
              "legendFormat": "{{node}} write",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "MBs",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "gpu",
        "intel",
        "media"
      ],
      "templating": {
        "list": [
          {
            "name": "node",
            "label": "Node",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS:-PBFA97CFB590B2093}"
            },
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "query": {
              "query": "label_values(gpumon_engine_usage, node)",
              "refId": "q"
            },
            "refresh": 2,
            "sort": 1,
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Intel GPU",
      "uid": "intel-gpu",
      "version": 1
    }
