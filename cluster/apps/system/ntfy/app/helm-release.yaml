# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  values:
    controllers:
      ntfy:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          init-config:
            image:
              repository: alpine
              tag: 3.24.2
            command: ["/bin/sh", "-c"]
            args:
              - |
                sed -e "s|NTFY_DATABASE_URL_PLACEHOLDER|$NTFY_DATABASE_URL|g" \
                    /etc/ntfy-template/server.yml > /etc/ntfy/server.yml
            envFrom:
              - secretRef:
                  name: ntfy-secret

        containers:
          main:
            image:
              repository: docker.io/binwiederhier/ntfy
              tag: v2.28.0
            args:
              - serve
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/health
                    port: 80
                  initialDelaySeconds: 5
                  periodSeconds: 15
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/health
                    port: 80
                  initialDelaySeconds: 5
                  periodSeconds: 15
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: ntfy
        ports:
          http:
            port: 80
          metrics:
            port: 9090

    serviceMonitor:
      main:
        serviceName: ntfy
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m

    route:
      main:
        enabled: true
        annotations:
          gatus.io/enabled: "true"
        parentRefs:
          - name: external-gateway
            namespace: networking
        hostnames:
          - "ntfy.${SECRET_DOMAIN}"
        rules:
          - backendRefs:
              - identifier: app
                port: 80

    persistence:
      config-template:
        type: custom
        volumeSpec:
          configMap:
            name: ntfy
        advancedMounts:
          ntfy:
            init-config:
              - path: /etc/ntfy-template/server.yml
                subPath: server.yml
      config:
        type: emptyDir
        advancedMounts:
          ntfy:
            init-config:
              - path: /etc/ntfy
            main:
              - path: /etc/ntfy
