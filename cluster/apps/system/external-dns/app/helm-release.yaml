apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: system
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: 1.21.1
      sourceRef:
        kind: HelmRepository
        name: external-dns-charts
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
    remediation: # perform remediation when helm install fails
      retries: 3
  upgrade:
    remediation: # perform remediation when helm upgrade fails
      retries: 3
      remediateLastFailure: true # remediate the last failure, when no retries remain
    cleanupOnFail: true
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
  maxHistory: 3
  values:
    interval: 2m

    sources:
      - crd
      - gateway-httproute

    provider:
      name: cloudflare

    policy: sync
    txtPrefix: "k8s."
    txtOwnerId: default
    domainFilters:
      - "${SECRET_DOMAIN}"
      - "${SECRET_MLM_DOMAIN_1}"
      - "${SECRET_MLM_DOMAIN_2}"
      - "${SECRET_MLM_DOMAIN_3}"

    podAnnotations:
      secret.reloader.stakater.com/reload: cloudflare-api-key

    resources:
      requests:
        memory: 100Mi
        cpu: 25m
      limits:
        memory: 250Mi

    env:
      - name: CF_API_EMAIL
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-key
            key: cloudflare_email
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-key
            key: cloudflare_api_token

    extraArgs:
      - --annotation-prefix=external-dns.kubernetes.io/
      - --gateway-label-filter=gateway.home-operations.io/type=external
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      # Default every record this manages to proxied. An unproxied CNAME chain that
      # bottoms out at a Cloudflare Tunnel (fast.${SECRET_DOMAIN} -> <tunnelid>.cfargotunnel.com)
      # only resolves to Cloudflare's real anycast IPs for the hostname that is *itself*
      # proxied - an unproxied intermediate hop just returns the literal configured
      # target, which for a tunnel is a deliberately unroutable address (confirmed live:
      # every app CNAMEing through fast.${SECRET_DOMAIN} was unreachable by real clients
      # until this). The handful of apps that need to stay on the VPS path (unproxied,
      # since Cloudflare must not intercept them) override back with
      # external-dns.kubernetes.io/cloudflare-proxied: "false" on their own route.
      - --cloudflare-proxied
