# Migrated from the legacy kyverno.io/v1 ClusterPolicy to the CEL-based
# policies.kyverno.io/v1 GeneratingPolicy type (Kyverno 3.10 blocks the Helm
# upgrade while any legacy ClusterPolicy exists; see TODO.md and
# https://kyverno.io/docs/guides/migration-to-cel/).
#
# matchConstraints.resourceNames below is the union of both original rules'
# namespace lists; each generate entry below reproduces one original rule's
# own, narrower list via an inline CEL membership check, so the per-secret
# namespace targeting is unchanged.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: sync-certificates
  annotations:
    policies.kyverno.io/title: Sync Secrets
    policies.kyverno.io/category: Sample
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      Secrets like registry credentials often need to exist in multiple
      Namespaces so Pods there have access. Manually duplicating those Secrets
      is time consuming and error prone. This policy will copy a
      Secret called `regcred` which exists in the `default` Namespace to
      new Namespaces when they are created. It will also push updates to
      the copied Secrets should the source Secret be changed.
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["namespaces"]
        resourceNames:
          # networking excluded (since that's the source)
          - ai
          - auth
          - backups
          - databases
          - development
          - flux-system
          - household
          - kube-system
          - media
          - monitoring
          - other
          - storage
          - vaultwarden
  variables:
    - name: nsName
      expression: object.metadata.name
    - name: internalSource
      expression: resource.Get("v1", "secrets", "networking", "wildcard-internal-${SECRET_DOMAIN/./-}-tls")
    - name: externalSource
      expression: resource.Get("v1", "secrets", "networking", "wildcard-${SECRET_DOMAIN/./-}-tls")
  generate:
    - expression: >-
        ['ai','databases','development','flux-system','household','kube-system','media','monitoring','other','storage'].exists(n, n == variables.nsName)
          ? generator.Apply(variables.nsName, [variables.internalSource])
          : true
    - expression: >-
        ['ai','auth','backups','databases','development','flux-system','household','media','other','vaultwarden'].exists(n, n == variables.nsName)
          ? generator.Apply(variables.nsName, [variables.externalSource])
          : true
