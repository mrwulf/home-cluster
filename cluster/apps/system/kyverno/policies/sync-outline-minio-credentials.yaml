---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sync-outline-minio-credentials
  annotations:
    policies.kyverno.io/title: Sync Outline MinIO Credentials
    policies.kyverno.io/category: Sample
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      Copies the outline-minio-credentials Secret (a Tofu-generated,
      bucket-scoped MinIO IAM user - see
      cluster/apps/household/outline/minio-bucket) from the databases
      Namespace, where it's created alongside MinIO's root credentials,
      into household, where the Outline Pod that actually consumes it runs.
spec:
  rules:
    - name: sync-outline-minio-credentials
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names: [household]
      generate:
        generateExisting: true
        apiVersion: v1
        kind: Secret
        name: outline-minio-credentials
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        clone:
          namespace: databases
          name: outline-minio-credentials
