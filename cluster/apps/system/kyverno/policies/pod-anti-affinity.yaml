# Migrated from the legacy kyverno.io/v1 ClusterPolicy to the CEL-based
# policies.kyverno.io/v1 MutatingPolicy type (Kyverno 3.10 blocks the Helm
# upgrade while any legacy ClusterPolicy exists; see TODO.md and
# https://kyverno.io/docs/guides/migration-to-cel/).
#
# The legacy `patchStrategicMerge` used `+(key)` markers to only add the
# anti-affinity block if it was entirely absent, never touching a Deployment
# that already defines its own affinity. That "only if absent" guard is moved
# into matchConditions below instead (ApplyConfiguration has no direct
# equivalent to `+()`), which is equivalent: the policy simply doesn't run
# again once the field exists.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: insert-pod-antiaffinity
  annotations:
    policies.kyverno.io/title: Add Pod Anti-Affinity
    policies.kyverno.io/subject: Deployment, Pod
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      Applications may involve multiple replicas of the same Pod for availability as well as scale
      purposes, yet Kubernetes does not by default provide a solution for availability. This policy
      sets a Pod anti-affinity configuration on Deployments which contain an `app` label if it is
      not already present.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  matchConditions:
    - name: has-app-label
      expression: >-
        object.spec.template.metadata.?labels.app.orValue('') != ''
    - name: no-existing-antiaffinity
      expression: >-
        !has(object.spec.template.spec.affinity) ||
        !has(object.spec.template.spec.affinity.podAntiAffinity) ||
        !has(object.spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution)
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              template: Object.spec.template{
                spec: Object.spec.template.spec{
                  affinity: Object.spec.template.spec.affinity{
                    podAntiAffinity: Object.spec.template.spec.affinity.podAntiAffinity{
                      preferredDuringSchedulingIgnoredDuringExecution: [
                        Object.spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution{
                          weight: 1,
                          podAffinityTerm: Object.spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution.podAffinityTerm{
                            topologyKey: "kubernetes.io/hostname",
                            labelSelector: Object.spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution.podAffinityTerm.labelSelector{
                              matchExpressions: [
                                Object.spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution.podAffinityTerm.labelSelector.matchExpressions{
                                  key: "app",
                                  operator: "In",
                                  values: [object.spec.template.metadata.labels.app]
                                }
                              ]
                            }
                          }
                        }
                      ]
                    }
                  }
                }
              }
            }
          }
