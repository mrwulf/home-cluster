# Migrated from the legacy kyverno.io/v1 ClusterPolicy to the CEL-based
# policies.kyverno.io/v1 MutatingPolicy type (Kyverno 3.10 blocks the Helm
# upgrade while any legacy ClusterPolicy exists; see TODO.md and
# https://kyverno.io/docs/guides/migration-to-cel/).
#
# The legacy `patchStrategicMerge` used `+(key)` markers to only add the
# anti-affinity block if it was entirely absent, never touching a Deployment
# that already defines its own affinity. That "only if absent" guard is moved
# into matchConditions below instead, which is equivalent: the policy simply
# doesn't run again once the field exists.
#
# This has to be a JSONPatch: the preferred anti-affinity list is atomic in the
# Deployment schema, so an ApplyConfiguration that sets it fails to evaluate and
# the webhook rejects the whole CREATE/UPDATE. JSONPatch "add" needs the parent
# object to exist, hence one branch per missing level.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: insert-pod-antiaffinity
  annotations:
    policies.kyverno.io/title: Add Pod Anti-Affinity
    policies.kyverno.io/subject: Deployment, Pod
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      Applications may involve multiple replicas of the same Pod for availability as well as scale
      purposes, yet Kubernetes does not by default provide a solution for availability. This policy
      sets a Pod anti-affinity configuration on Deployments which contain an `app` label if it is
      not already present.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  matchConditions:
    - name: has-app-label
      expression: >-
        object.spec.template.metadata.?labels.app.orValue('') != ''
    - name: no-existing-antiaffinity
      expression: >-
        !has(object.spec.template.spec.affinity) ||
        !has(object.spec.template.spec.affinity.podAntiAffinity) ||
        !has(object.spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution)
  variables:
    - name: preferred
      expression: >-
        [{
          "weight": dyn(1),
          "podAffinityTerm": dyn({
            "topologyKey": dyn("kubernetes.io/hostname"),
            "labelSelector": dyn({
              "matchExpressions": [{
                "key": dyn("app"),
                "operator": dyn("In"),
                "values": dyn([object.spec.template.metadata.labels.app])
              }]
            })
          })
        }]
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          !has(object.spec.template.spec.affinity) ?
            [JSONPatch{
              op: "add",
              path: "/spec/template/spec/affinity",
              value: {"podAntiAffinity": {"preferredDuringSchedulingIgnoredDuringExecution": variables.preferred}}
            }] :
          !has(object.spec.template.spec.affinity.podAntiAffinity) ?
            [JSONPatch{
              op: "add",
              path: "/spec/template/spec/affinity/podAntiAffinity",
              value: {"preferredDuringSchedulingIgnoredDuringExecution": variables.preferred}
            }] :
            [JSONPatch{
              op: "add",
              path: "/spec/template/spec/affinity/podAntiAffinity/preferredDuringSchedulingIgnoredDuringExecution",
              value: variables.preferred
            }]
