# Migrated from the legacy kyverno.io/v1 ClusterPolicy to the CEL-based
# policies.kyverno.io/v1 GeneratingPolicy type (Kyverno 3.10 blocks the Helm
# upgrade while any legacy ClusterPolicy exists; see TODO.md and
# https://kyverno.io/docs/guides/migration-to-cel/).
#
# The legacy policy had 3 separate rules (auth/household/media, then
# services, then a dead system rule) only because Kyverno rejected edits to
# an existing generate rule, forcing each later namespace addition into a
# new rule. That restriction is gone with the CEL engine, so this is one
# generate entry covering the full namespace set. The dead `system` rule
# (kyverno.io/v1 ClusterPolicy webhooks exclude Kyverno's own install
# namespace, `system`, by default, so it could never fire) is dropped
# rather than carried forward.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: sync-postgres-creds
  annotations:
    policies.kyverno.io/title: Sync Secrets
    policies.kyverno.io/category: Sample
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      Secrets like registry credentials often need to exist in multiple
      Namespaces so Pods there have access. Manually duplicating those Secrets
      is time consuming and error prone. This policy will copy a
      Secret called `regcred` which exists in the `default` Namespace to
      new Namespaces when they are created. It will also push updates to
      the copied Secrets should the source Secret be changed.
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["namespaces"]
        resourceNames: [auth, household, media, services] # databases ns excluded (since that's the source)
  variables:
    - name: nsName
      expression: object.metadata.name
    - name: source
      expression: resource.Get("v1", "secrets", "databases", "postgres-superuser")
  generate:
    - expression: generator.Apply(variables.nsName, [variables.source])
