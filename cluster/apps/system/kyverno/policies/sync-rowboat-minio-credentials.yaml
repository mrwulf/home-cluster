# Migrated from the legacy kyverno.io/v1 ClusterPolicy to the CEL-based
# policies.kyverno.io/v1 GeneratingPolicy type (Kyverno 3.10 blocks the Helm
# upgrade while any legacy ClusterPolicy exists; see TODO.md and
# https://kyverno.io/docs/guides/migration-to-cel/).
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: sync-rowboat-minio-credentials
  annotations:
    policies.kyverno.io/title: Sync Rowboat MinIO Credentials
    policies.kyverno.io/category: Sample
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      Copies the rowboat-minio-credentials Secret (a Tofu-generated,
      bucket-scoped MinIO IAM user - see
      cluster/apps/ai/rowboat/minio-bucket) from the databases
      Namespace, where it is created alongside MinIO root credentials,
      into ai, where the Rowboat Pod that actually consumes it runs.
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["namespaces"]
        resourceNames: ["ai"]
  variables:
    - name: nsName
      expression: object.metadata.name
    - name: source
      expression: resource.Get("v1", "secrets", "databases", "rowboat-minio-credentials")
  generate:
    - expression: generator.Apply(variables.nsName, [variables.source])
