---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sync-affine-minio-credentials
  annotations:
    policies.kyverno.io/title: Sync AFFiNE MinIO Credentials
    policies.kyverno.io/category: Sample
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      Copies the affine-minio-credentials Secret (a Tofu-generated, bucket-scoped
      MinIO IAM user - see cluster/apps/household/affine/minio-bucket) from the
      databases Namespace, where it's created alongside MinIO's root credentials,
      into household, where the AFFiNE Pod that actually consumes it runs.
spec:
  rules:
    - name: sync-affine-minio-credentials
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names: [household]
      generate:
        generateExisting: true
        apiVersion: v1
        kind: Secret
        name: affine-minio-credentials
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        clone:
          namespace: databases
          name: affine-minio-credentials
