# Migrated from the legacy kyverno.io/v1 ClusterPolicy to the CEL-based
# policies.kyverno.io/v1 MutatingPolicy type (Kyverno 3.10 blocks the Helm
# upgrade while any legacy ClusterPolicy exists; see TODO.md and
# https://kyverno.io/docs/guides/migration-to-cel/).
#
# Leaving `spec.autogen.podControllers` unset is NOT equivalent to the
# legacy `pod-policies.kyverno.io/autogen-controllers: none` annotation.
# Confirmed live on the cluster 2026-11-16: with it unset, Kyverno
# autogenerates extra rules for Deployment/DaemonSet/ReplicaSet/
# StatefulSet/Job/CronJob that reuse this policy's CEL verbatim. That CEL
# builds the JSONPatch `path` as a string literal ("/spec/containers/..."),
# which Kyverno's autogen rewriter correctly leaves untouched (it only
# rewrites `object.spec`/`object.metadata` CEL tokens, not string
# literals), so every autogenerated rule tries to patch a path that only
# exists on a Pod and fails admission with "no such key: containers" on
# every Job/CronJob/Deployment/etc in the cluster. `controllers: ["none"]`
# is the actual CEL-type equivalent: "none" doesn't match any built-in
# autogen target and fails live-discovery resolution too, so Kyverno
# silently drops it and generates nothing, leaving this scoped to Pod only.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-pod-gateway-sidecar-resources
  annotations:
    policies.kyverno.io/title: Add pod-gateway sidecar/init container resources
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The pod-gateway mutating webhook (gateway-admision-controller) injects a
      `gateway-sidecar` container and a `gateway-init` init container into any pod
      matching its namespaceSelector (e.g. qbittorrent). That webhook binary has no
      chart value or CLI flag to size what it injects, so every routed pod otherwise
      runs it with no requests/limits. This policy adds them, by name, after
      pod-gateway's own webhook has run.
spec:
  autogen:
    podControllers:
      controllers: ["none"]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          object.spec.containers.filter(c, c.name == "gateway-sidecar").map(c,
            JSONPatch{
              op: "add",
              path: "/spec/containers/" + string(object.spec.containers.indexOf(c)) + "/resources",
              value: {
                "requests": {"cpu": "10m", "memory": "32Mi"},
                "limits": {"memory": "128Mi"}
              }
            }
          )
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          !has(object.spec.initContainers) ? [] :
          object.spec.initContainers.filter(c, c.name == "gateway-init").map(c,
            JSONPatch{
              op: "add",
              path: "/spec/initContainers/" + string(object.spec.initContainers.indexOf(c)) + "/resources",
              value: {
                "requests": {"cpu": "10m", "memory": "16Mi"},
                "limits": {"memory": "64Mi"}
              }
            }
          )
