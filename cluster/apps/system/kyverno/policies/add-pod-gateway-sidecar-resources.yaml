---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-pod-gateway-sidecar-resources
  annotations:
    policies.kyverno.io/title: Add pod-gateway sidecar/init container resources
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The pod-gateway mutating webhook (gateway-admision-controller) injects a
      `gateway-sidecar` container and a `gateway-init` init container into any pod
      matching its namespaceSelector (e.g. qbittorrent). That webhook binary has no
      chart value or CLI flag to size what it injects, so every routed pod otherwise
      runs it with no requests/limits. This policy adds them, by name, after
      pod-gateway's own webhook has run.
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  rules:
    - name: add-gateway-sidecar-resources
      match:
        any:
          - resources:
              kinds: ["Pod"]
      preconditions:
        all:
          - key: "{{ request.object.spec.containers[?name=='gateway-sidecar'] || `[]` | length(@) }}"
            operator: GreaterThanOrEquals
            value: 1
      mutate:
        foreach:
          - list: "request.object.spec.containers"
            preconditions:
              all:
                - key: "{{ element.name }}"
                  operator: Equals
                  value: "gateway-sidecar"
            patchesJson6902: |-
              - path: /spec/containers/{{elementIndex}}/resources
                op: add
                value:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    memory: 128Mi
    - name: add-gateway-init-resources
      match:
        any:
          - resources:
              kinds: ["Pod"]
      preconditions:
        all:
          - key: "{{ request.object.spec.initContainers[?name=='gateway-init'] || `[]` | length(@) }}"
            operator: GreaterThanOrEquals
            value: 1
      mutate:
        foreach:
          - list: "request.object.spec.initContainers"
            preconditions:
              all:
                - key: "{{ element.name }}"
                  operator: Equals
                  value: "gateway-init"
            patchesJson6902: |-
              - path: /spec/initContainers/{{elementIndex}}/resources
                op: add
                value:
                  requests:
                    cpu: 10m
                    memory: 16Mi
                  limits:
                    memory: 64Mi
