apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  interval: 1h
  chart:
    spec:
      chart: kyverno
      version: 3.9.0
      sourceRef:
        kind: HelmRepository
        name: kyverno-charts
        namespace: flux-system
      interval: 1h
  test:
    enable: true
  values:
    admissionController:
      replicas: 3
      rbac:
        clusterRole:
          extraResources:
            - apiGroups:
                - ""
                - "v1"
              resources:
                - pods
                - secrets
              verbs:
                - create
                - update
                - patch
                - delete
                - get
                - list
            - apiGroups:
                - traefik.io
              resources:
                - middlewares
              verbs:
                - create
                - update
                - patch
                - delete
                - get
                - list
                - watch
      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: kyverno
      serviceMonitor:
        enabled: true
    backgroundController:
      rbac:
        clusterRole:
          extraResources:
            - apiGroups:
                - ""
                - "v1"
              resources:
                - pods
                - secrets
              verbs:
                - create
                - update
                - patch
                - delete
                - get
                - list
            - apiGroups:
                - traefik.io
              resources:
                - middlewares
              verbs:
                - create
                - update
                - patch
                - delete
                - get
                - list
                - watch
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 1Gi
      serviceMonitor:
        enabled: true
    cleanupController:
      serviceMonitor:
        enabled: true
    reportsController:
      serviceMonitor:
        enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      extraArgs:
        allowedResults: fail,warn,error

    grafana:
      enabled: true
      namespace: monitoring
