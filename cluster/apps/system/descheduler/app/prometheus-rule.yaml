---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: descheduler-rules
spec:
  groups:
    - name: descheduler.rules
      rules:
        - alert: DeschedulerPodEvicted
          expr: |-
            increase(descheduler_pods_evicted_total[5m]) > 0
          annotations:
            summary: >-
              Descheduler evicted pod(s) on node {{ $labels.node }} in namespace {{ $labels.namespace }} via strategy {{ $labels.strategy }} within the last 5 minutes
            # Metrics carry no pod names; the descheduler logs one "Evicted pod" line per eviction.
            # Grafana Explore on Loki, last 6 hours (evictions are sporadic and alerts get read late).
            # ntfy-alertmanager prints this link in the notification body.
            # The link goes through /login?redirectTo= on purpose. Grafana allows anonymous Viewer access, and a
            # logged-out visitor sent straight to /explore landed on the home page (likely no Explore access as
            # a Viewer). /login starts the Pocket ID login and carries the target through it.
            # The Loki query uses backtick strings so the JSON needs no escaping (no backslash in the URL).
            logs_url: >-
              https://grafana.home.${SECRET_DOMAIN}/login?redirectTo=%2Fexplore%3Fleft%3D%257B%2522datasource%2522%253A%2522Loki%2522%252C%2522queries%2522%253A%255B%257B%2522refId%2522%253A%2522A%2522%252C%2522expr%2522%253A%2522%257Bjob%253D%2560kubernetes%2560%252Ck8s_app%253D%2560descheduler%2560%257D%2520%257C%253D%2520%2560Evicted%2520pod%2560%2522%257D%255D%252C%2522range%2522%253A%257B%2522from%2522%253A%2522now-6h%2522%252C%2522to%2522%253A%2522now%2522%257D%257D
          labels:
            severity: warning
