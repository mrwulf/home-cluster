---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: descheduler-rules
spec:
  groups:
    - name: descheduler.rules
      rules:
        - alert: DeschedulerPodEvicted
          expr: |-
            increase(descheduler_pods_evicted_total[5m]) > 0
          annotations:
            summary: >-
              Descheduler evicted pod(s) on node {{ $labels.node }} in namespace {{ $labels.namespace }} via strategy {{ $labels.strategy }} within the last 5 minutes
            # Metrics carry no pod names; the descheduler logs one "Evicted pod" line per eviction.
            # Grafana Explore on Loki, last hour. ntfy-alertmanager prints this link in the notification body.
            # The query uses backtick strings so the URL has no backslash (%5C); with one, the post-login
            # redirect landed on the Grafana home page instead of Explore.
            logs_url: >-
              https://grafana.home.${SECRET_DOMAIN}/explore?left=%7B%22datasource%22%3A%22Loki%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22expr%22%3A%22%7Bjob%3D%60kubernetes%60%2Ck8s_app%3D%60descheduler%60%7D%20%7C%3D%20%60Evicted%20pod%60%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-1h%22%2C%22to%22%3A%22now%22%7D%7D
          labels:
            severity: warning
