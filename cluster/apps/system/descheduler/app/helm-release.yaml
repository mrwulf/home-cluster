apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
spec:
  interval: 1h
  chart:
    spec:
      chart: descheduler
      version: 0.36.0
      sourceRef:
        kind: HelmRepository
        name: descheduler-charts
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
  maxHistory: 3
  values:
    replicas: 2
    kind: Deployment
    deschedulerPolicyAPIVersion: descheduler/v1alpha2
    resources:
      requests:
        cpu: 25m
        memory: 100Mi

    service:
      enabled: true
    serviceMonitor:
      enabled: true
    leaderElection:
      enabled: true

    deschedulerPolicy:
      # https://github.com/kubernetes-sigs/descheduler/blob/release-1.32/README.md
      profiles:
        - name: default
          pluginConfig:
            - name: DefaultEvictor
              args:
                nodeFit: true
                evictFailedBarePods: true
                evictLocalStoragePods: true
                evictSystemCriticalPods: true
            - name: LowNodeUtilization
              args:
                targetThresholds:
                  cpu: 35
                  memory: 30
                  pods: 50
                thresholds:
                  cpu: 25
                  memory: 20
                  pods: 25
                useDeviationThresholds: true
            - name: RemoveDuplicates
              args:
                excludeOwnerKinds:
                  - ReplicaSet
            - name: RemovePodsHavingTooManyRestarts
              args:
                podRestartThreshold: 10
                includingInitContainers: true
            - name: RemovePodsViolatingInterPodAntiAffinity
            - name: RemovePodsViolatingNodeAffinity
              args:
                nodeAffinityType:
                  - requiredDuringSchedulingIgnoredDuringExecution
            - name: RemovePodsViolatingNodeTaints
            - name: RemovePodsViolatingTopologySpreadConstraint
              args:
                constraints:
                  - DoNotSchedule
                  - ScheduleAnyway
          plugins:
            balance:
              enabled:
                - RemovePodsViolatingTopologySpreadConstraint
                - LowNodeUtilization
            deschedule:
              enabled:
                - RemovePodsHavingTooManyRestarts
                - RemovePodsViolatingNodeTaints
                - RemovePodsViolatingNodeAffinity
                - RemovePodsViolatingInterPodAntiAffinity
        # Garbage-collects dead pods (stuck-Pending, Failed, Evicted, etc.) regardless of
        # owner kind. Split out from the "default" profile because nodeFit: true there
        # blocks these evictions for node-pinned pods (e.g. Rook's mon/osd/exporter,
        # which have a nodeSelector to their own host and so never "fit" elsewhere) -
        # replaces kube-cleanup-operator, which only ever reaped Job-owned or
        # ownerless pods.
        - name: cleanup
          pluginConfig:
            - name: DefaultEvictor
              args:
                nodeFit: false
                evictFailedBarePods: true
                evictLocalStoragePods: true
                evictSystemCriticalPods: true
            - name: PodLifeTime
              args:
                maxPodLifeTimeSeconds: 300
                states:
                  - ContainerCannotRun
                  - CrashLoopBackOff
                  - CreateContainerConfigError
                  - CreateContainerError
                  - ErrImagePull
                  - Error
                  - ImagePullBackOff
                  - InvalidImageName
                  - OOMKilled
                  - Pending
                  - PodInitializing
            - name: RemoveFailedPods
              args:
                includingInitContainers: true
                minPodLifetimeSeconds: 300
          plugins:
            deschedule:
              enabled:
                - RemoveFailedPods
                - PodLifeTime
