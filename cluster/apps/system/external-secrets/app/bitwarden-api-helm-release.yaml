# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bitwarden-api
  namespace: system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    controllers:
      main:
        replicas: 2
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: node
              tag: 22-alpine
            command:
              - /bin/sh
              - -c
              - |
                apk add --no-cache curl jq
                npm install -g @bitwarden/cli@2026.7.0
                export BITWARDENCLI_APPDATA_DIR=/.config
                rm -rf /.config/* ~/.config/* 2>/dev/null || true
                echo "Configuring BW server to: $BW_HOST"
                bw config server "$BW_HOST"
                bw status | jq .environmentUrl
                bw login --apikey "$BW_CLIENTID" "$BW_CLIENTSECRET"
                export BW_SESSION=$(bw unlock --passwordenv BW_PASSWORD --raw)
                exec bw serve --hostname 127.0.0.1 --port 8088
            envFrom:
              - secretRef:
                  name: bitwarden-cli
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      [
                        "sh",
                        "-c",
                        "curl -X POST -s http://127.0.0.1:8088/sync | jq -e '.success == true'",
                      ]
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
              readiness:
                enabled: false
            resources:
              requests:
                memory: 256Mi
                cpu: 100m
              limits:
                memory: 512Mi
          proxy:
            image:
              repository: python
              tag: 3.14-alpine
            command:
              - python3
              - /app/proxy.py
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8087
    persistence:
      cache:
        type: emptyDir
        globalMounts:
          - path: /.config
      proxy-config:
        type: configMap
        name: bitwarden-api-proxy-config
        globalMounts:
          - path: /app/proxy.py
            subPath: proxy.py
            readOnly: true
