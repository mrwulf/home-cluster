# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bitwarden-api
  namespace: system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    controllers:
      main:
        replicas: 2
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/larivierec/bitwarden-cli
              tag: 2024.9.0
            command:
              - /bin/bash
              - -c
              - |
                sed -i 's/bw serve --hostname 0.0.0.0/bw serve --hostname 0.0.0.0 --port 8088/g' /entrypoint.sh
                exec /entrypoint.sh
            envFrom:
              - secretRef:
                  name: bitwarden-cli
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      [
                        "sh",
                        "-c",
                        "curl -X POST -s http://127.0.0.1:8088/sync | jq -e '.success == true'",
                      ]
                  timeoutSeconds: 5
              readiness:
                enabled: false
            resources:
              requests:
                memory: 256Mi
                cpu: 100m
              limits:
                memory: 512Mi
          proxy:
            image:
              repository: python
              tag: 3.12-alpine
            command:
              - python3
              - /app/proxy.py
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8087
    persistence:
      cache:
        type: emptyDir
        globalMounts:
          - path: /.config
      proxy-config:
        type: configMap
        name: bitwarden-api-nginx
        globalMounts:
          - path: /app/proxy.py
            subPath: proxy.py
            readOnly: true
