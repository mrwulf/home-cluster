---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: volsync-rules
spec:
  groups:
    - name: volsync.rules
      rules:
        - alert: VolSyncComponentAbsent
          annotations:
            summary: VolSync component has disappeared from Prometheus target discovery.
          expr: absent(up{job="volsync-metrics"})
          for: 15m
          labels:
            severity: critical
        - alert: VolSyncVolumeOutOfSync
          annotations:
            summary: "{{ $labels.obj_namespace }}/{{ $labels.obj_name }} volume is out of sync."
          expr: volsync_volume_out_of_sync == 1
          for: 15m
          labels:
            severity: critical
        # Out-of-sync only fires once the next scheduled slot is missed (up to 24h
        # for daily plans); this catches a hung mover as soon as it overruns.
        - alert: VolSyncMoverStuck
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.job_name }} mover has been running for over an hour."
          expr: |
            (time() - kube_job_status_start_time{job_name=~"volsync-(src|dst)-.+"})
              * on(namespace, job_name) group_left() (kube_job_status_active > 0) > 3600
          for: 5m
          labels:
            severity: warning
