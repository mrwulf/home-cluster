---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tf-runner
  namespace: databases
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tf-runner-databases-binding
subjects:
  - kind: ServiceAccount
    name: tf-runner
    namespace: databases
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tf-runner-role
