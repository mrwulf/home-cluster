---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    enableDiscoveryDaemon: true
    discover:
      # The chart's deployment.yaml passes this straight to the operator's
      # DISCOVER_DAEMON_RESOURCES env var via {{ . | quote }} (no toJson), so a
      # nested YAML mapping here renders as Go's map[k:v] syntax, not valid JSON,
      # and the operator silently ignores it. Must be a pre-formatted JSON string.
      resources: '{"requests":{"cpu":"10m","memory":"64Mi"},"limits":{"memory":"128Mi"}}'
    crds:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
    monitoring:
      enabled: true
