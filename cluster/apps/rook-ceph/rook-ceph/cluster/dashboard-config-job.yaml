---
apiVersion: batch/v1
kind: Job
metadata:
  name: ceph-dashboard-config
  namespace: rook-ceph
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      serviceAccountName: rook-ceph-default
      containers:
        - name: config
          image: quay.io/ceph/ceph:v21.1.1
          command:
            - /bin/bash
            - -c
            - |
              # Write ceph config
              CEPH_CONFIG="/etc/ceph/ceph.conf"
              MON_CONFIG="/etc/rook/mon-endpoints"
              KEYRING_FILE="/etc/ceph/keyring"

              write_endpoints() {
                endpoints=$(cat "$MON_CONFIG")
                mon_endpoints=$(echo "$endpoints" | sed 's/[a-z0-9_-]\+=//g')
                printf "[global]\nmon_host = %s\n\n[client.admin]\nkeyring = %s\n" "$mon_endpoints" "$KEYRING_FILE" > "$CEPH_CONFIG"
              }

              ceph_secret=$(cat /var/lib/rook-ceph-mon/secret.keyring)
              printf "[%s]\nkey = %s\n" "$ROOK_CEPH_USERNAME" "$ceph_secret" > "$KEYRING_FILE"

              write_endpoints

              # Each block checks current state first, so the job is idempotent and
              # re-applies whatever a mgr restart or cluster rebuild dropped.

              # --- Grafana ---
              current_url=$(ceph config-key get mgr/dashboard/grafana_api_url 2>/dev/null || true)
              if [[ "$current_url" == "http://grafana-service.monitoring.svc.cluster.local:3000" ]]; then
                echo "Grafana configuration is already set correctly."
              else
                echo "Setting Ceph Dashboard Grafana settings..."
                ceph dashboard set-grafana-api-url "http://grafana-service.monitoring.svc.cluster.local:3000"
                ceph dashboard set-grafana-api-ssl-verify False
                ceph dashboard set-grafana-frontend-api-url "https://grafana.home.${SECRET_DOMAIN}"
              fi

              # --- OAuth2 SSO (Pocket ID via oauth2-proxy; see ../README.md) ---
              # The roles_path only persists if the mgr already loaded the SSO DB
              # as OAuth2. On a mgr still in local/SAML2 mode the first "enable"
              # sets it in memory only, so verify the stored value and retry.
              sso_persisted() {
                ceph config-key get mgr/dashboard/ssodb_v1 2>/dev/null | python3 -c '
              import json, sys
              d = json.load(sys.stdin)
              sys.exit(0 if d.get("protocol") == "oauth2" and d.get("oauth2", {}).get("roles_path") == "groups" else 1)'
              }
              for attempt in 1 2 3; do
                if sso_persisted; then
                  echo "OAuth2 SSO is already configured."
                  break
                fi
                if [[ "$attempt" == 3 ]]; then
                  echo "OAuth2 SSO roles_path did not persist after retries" >&2
                  exit 1
                fi
                echo "Enabling Ceph Dashboard OAuth2 SSO (attempt $attempt)..."
                ceph dashboard sso enable oauth2 groups
              done
              # --- Dashboard session lifetime ---
              # Must stay below oauth2-proxy's cookie-expire (50m) and Pocket ID's
              # fixed 1h id_token - see ../README.md.
              if [[ "$(ceph dashboard get-jwt-token-ttl)" != "2700" ]]; then
                ceph dashboard set-jwt-token-ttl 2700
              fi
              echo "Done!"
          env:
            - name: ROOK_CEPH_USERNAME
              valueFrom:
                secretKeyRef:
                  key: ceph-username
                  name: rook-ceph-mon
            - name: SECRET_DOMAIN
              value: "${SECRET_DOMAIN}"
          volumeMounts:
            - mountPath: /etc/ceph
              name: ceph-config
            - mountPath: /etc/rook
              name: mon-endpoint-volume
            - mountPath: /var/lib/rook-ceph-mon
              name: ceph-admin-secret
          securityContext:
            capabilities:
              drop:
                - ALL
            runAsGroup: 2016
            runAsNonRoot: true
            runAsUser: 2016
      restartPolicy: OnFailure
      volumes:
        - name: ceph-admin-secret
          secret:
            defaultMode: 420
            items:
              - key: ceph-secret
                path: secret.keyring
            secretName: rook-ceph-mon
        - configMap:
            defaultMode: 420
            items:
              - key: data
                path: mon-endpoints
            name: rook-ceph-mon-endpoints
          name: mon-endpoint-volume
        - emptyDir: {}
          name: ceph-config
