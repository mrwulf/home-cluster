---
# Ceph dashboard needs its raw ID token relayed as X-Access-Token so its
# native oauth2 SSO (ceph dashboard sso enable oauth2) can auto-login the
# user - see cluster/apps/auth/oauth2-proxy/app/configmap.yaml. That header
# carries the user's raw JWT, so it's kept out of the shared
# traefik-middleware-chain-pocket-id used by every other app behind Pocket
# ID rather than added there.
#
# Authorization is deliberately NOT relayed here (unlike the shared chain):
# after Ceph's own oauth2 login completes, its Angular frontend sends its
# own Ceph-issued JWT as Authorization on every /api/* call. Forwarding
# Pocket ID's id_token in that header instead overwrites the browser's
# header before Traefik proxies to the backend, so Ceph tries to validate
# the wrong token and every data call 500s even though login succeeds.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rook-ceph-pocket-id-forward-auth
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local:4180/
    trustForwardHeader: true
    authResponseHeaders:
      - X-Access-Token
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rook-ceph-chain-pocket-id
spec:
  chain:
    middlewares:
      - name: networking-traefik-middleware-rate-limit@kubernetescrd
      - name: networking-traefik-middleware-secure-headers@kubernetescrd
      - name: networking-traefik-middleware-compress@kubernetescrd
      - name: rook-ceph-pocket-id-forward-auth
