---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile
helmDefaults:
  cleanupOnFail: true
  wait: true
  waitForJobs: true

repositories:
  - name: cilium
    url: https://helm.cilium.io

releases:
  - name: cilium
    namespace: kube-system
    # renovate: registryUrl=https://helm.cilium.io
    # chart: cilium
    chart: cilium/cilium
    version: 1.19.10
    values:
      - ../cluster/apps/kube-system/cilium/helm-values.yaml
      # Resource requests/limits live only here - see the comment at the top
      # of that file. Keep both entries; this one is bootstrap's half.
      - ../cluster/apps/kube-system/cilium/resources-values.yaml
