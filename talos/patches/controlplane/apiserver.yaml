apiVersion: v1alpha1
kind: KubeAPIServerConfig
extraArgs:
  enable-aggregator-routing: "true"
  feature-gates: MutatingAdmissionPolicy=true
  runtime-config: admissionregistration.k8s.io/v1beta1=true
certExtraSANs:
  - k8s.home
  - ${clusterEndpointIP}
  - 127.0.0.1
  - 10.0.10.201
resources:
  requests:
    cpu: 400m
    memory: 1.5G
  limits:
    memory: 4G
---
apiVersion: v1alpha1
kind: KubeAuthenticationConfig
# `configuration` is Unstructured — a patch replaces it wholesale rather than merging, so
# the default anonymous (health-endpoint) access must be restated here alongside jwt.
configuration:
  anonymous:
    enabled: true
    conditions:
      - path: /livez
      - path: /readyz
      - path: /healthz
  jwt:
    - issuer:
        url: https://id.${SECRET_DOMAIN}
        audiences:
          - 287821e5-f31e-4073-9b2c-c30775e9fee6
      claimMappings:
        username:
          claim: email
        groups:
          claim: groups
          prefix: "oidc:"
