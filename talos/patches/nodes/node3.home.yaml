machine:
  type: controlplane
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    # Applies on reinstall only; see docs/ceph-node1-osd-swap.md (the PNY moves to node1 as a Ceph OSD).
    match: disk.model == "Micron MTFDHBA512TDV"
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: node3.home
---
apiVersion: v1alpha1
kind: BondConfig
name: bond0
addresses:
  - address: 10.0.1.53/23
