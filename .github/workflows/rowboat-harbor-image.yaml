---
# Rowboat publishes no Harbor image (only the Dockerfile in apps/harbor), so
# build it here from the pinned upstream release and push it to GHCR.
name: Rowboat Harbor Image

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - .github/workflows/rowboat-harbor-image.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # renovate: depName=rowboatlabs/rowboat datasource=github-releases
  ROWBOAT_VERSION: v1.0.9

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rowboatlabs/rowboat
          ref: ${{ env.ROWBOAT_VERSION }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/harbor
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rowboat-harbor:${{ env.ROWBOAT_VERSION }}
